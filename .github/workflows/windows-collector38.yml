name: Validate published Windows collector release
on:
  push:
    branches: [verification/windows-collector-38]
    paths: ['.github/workflows/windows-collector38.yml', '.github/qa-win/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download and launch the published Windows x64 application
        shell: powershell
        run: ./.github/qa-win/windows.ps1
