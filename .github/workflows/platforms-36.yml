name: VOIDLINE platform verification
on:
  push:
    branches: [verification/cartridges-platform-36]
    paths:
      - '.github/workflows/platforms-36.yml'
      - '.github/voidline-qa/**'
      - '.github/qa/**'
      - 'qa/ios-simulator/**'
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            qa/ios-simulator
            native/ios
      - name: Verify published pages in an iPhone Simulator WKWebView
        run: bash qa/ios-simulator/run.sh
      - name: Launch the native SwiftUI wrapper and verify the guest form on screen
        run: bash qa/ios-simulator/native.sh
      - name: Save guest screenshots and check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iphone-simulator-guest-evidence
          path: ${{ runner.temp }}/voidline-ios-evidence
          retention-days: 3
          if-no-files-found: ignore
  android-emulator:
    name: Android 15 · signed APK launch and Chrome playback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify production APK against this release
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/VOIDLINE-Android.apk"
          curl -fSsL --retry 3 --max-time 60 https://voidline-afterhours.pipedcactus1.chatgpt.site/downloads/VOIDLINE-Android.apk -o "$apk"
          test "$(stat -c '%s' "$apk")" = "$(jq -r .android.bytes dist/downloads/voidline-release.json)"
          echo "$(jq -r .android.sha256 dist/downloads/voidline-release.json)  $apk" | sha256sum -c -
          verifier="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$verifier" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/voidline-signature.txt"
          expected="$(jq -r .android.certificateSha256 dist/downloads/voidline-release.json | tr -d ':' | tr 'A-F' 'a-f')"
          grep -F "$expected" "$RUNNER_TEMP/voidline-signature.txt"
      - name: Enable hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch release APK on Google Play system image
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/qa/voidline-android.sh
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download and launch the published Windows x64 application
        shell: powershell
        run: ./.github/voidline-qa/windows.ps1
      - name: Play the six live collectible previews in Microsoft Edge
        shell: powershell
        run: node ./.github/voidline-qa/edge.cjs
