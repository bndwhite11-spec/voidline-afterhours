<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" data-vc-object="gift-copium-cartridge" data-art-version="3" data-variant="mini" role="img" aria-labelledby="va3-gift-copium-cartridge-mini-title"><title id="va3-gift-copium-cartridge-mini-title">A portable smoked-jade glass cartridge with brass end caps, visible imaginary green liquid, a spoked shutoff wheel, a white pressure gauge and the word COPIUM printed on its side. A brief valve release moves the needle and unwinds a soft vapor curl.</title><path d="m4 12 15-5 3 3-1 5-15 5-3-3Z" fill="#314b46" stroke="#172d31" stroke-width=".8"/><path d="m7 12 10-3 2 6-10 3Z" fill="#79a594"/><path d="m4 12 2-1 3 8-2 1-3-2Z" fill="#b49860" stroke="#564d34" stroke-width=".6"/><path d="m18 7 2-.5 3 8-2 1Z" fill="#b69f70" stroke="#4b4e3e" stroke-width=".6"/><circle cx="14" cy="13" r="3.2" fill="#e6e3ca" stroke="#8e875d" stroke-width=".9"/><path d="m14 13 1-2" stroke="#753e35" stroke-width="1"/><path d="m5 11-1-4m-2 1 4-2" stroke="#b2b9a5" stroke-width="1.2"/><circle cx="3.5" cy="7.2" r="2.2" fill="none" stroke="#ba9f68" stroke-width="1"/></svg>