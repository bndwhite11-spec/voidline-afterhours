<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" data-vc-object="gift-doomer-bloom" data-art-version="3" data-variant="silhouette" role="img" aria-labelledby="va3-gift-doomer-bloom-silhouette-title"><title id="va3-gift-doomer-bloom-silhouette-title">A small deadpan skull in a stitched charcoal beanie emerges from sharply folded violet flower petals, with elongated jade leaves. The petals fold away to reveal the skull before springing back.</title><g fill="#10161d" fill-rule="evenodd"><path d="m127 18 31 51 42-26-9 63 53 27-49 26 14 57-60-20-23 43-31-41-62 17 12-60-32-22 31-40-3-63 52 24Z"/><path d="m92 110-36-6-41 26 39 22 41-13Z"/><path d="m159 159 58 14-35 47-43-28Z"/></g></svg>