<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" data-vc-object="gift-copium-cartridge" data-art-version="3" data-variant="silhouette" role="img" aria-labelledby="va3-gift-copium-cartridge-silhouette-title"><title id="va3-gift-copium-cartridge-silhouette-title">A portable smoked-jade glass cartridge with brass end caps, visible imaginary green liquid, a spoked shutoff wheel, a white pressure gauge and the word COPIUM printed on its side. A brief valve release moves the needle and unwinds a soft vapor curl.</title><g fill="#10161d" fill-rule="evenodd"><g transform="rotate(-19 129 150)"><path d="M47 120h161c10 3 17 15 17 30s-7 27-17 30H47c-10-4-18-16-18-30s8-26 18-30Zm-3 0v-9h-3v-9h18v9h-3v9Z"/><path d="M50 88a14 14 0 1 0 0 28 14 14 0 0 0 0-28Zm0 5a9 9 0 1 1 0 18 9 9 0 0 1 0-18Z" fill-rule="evenodd"/><path d="M51 93c-13-10-11-20 2-25 11-4 16-10 10-17 14 5 12 17-2 22-12 5-12 10-5 17Z"/></g></g></svg>