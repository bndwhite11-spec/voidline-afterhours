<style data-source="home.css">
/* VOIDLINE — account forms and messenger. One shared scale, no fixture styles. */
:root {
  color-scheme: dark;
  --vh-bg: #1a1c22;
  --vh-rail: #101116;
  --vh-side: #15171d;
  --vh-surface: #22252d;
  --vh-raised: #2b2e38;
  --vh-line: #343640;
  --vh-line-soft: #292c34;
  --vh-text: #eeedf3;
  --vh-copy: #c9c8d1;
  --vh-muted: #a4a4b2;
  --vh-accent: #c1abe6;
  --vh-accent-ink: #20192c;
  --vh-danger: #f3acb8;
  --vh-success: #a6d7bd;
  --vh-radius: 10px;
  --vh-message-size: 15px;
  --vh-topbar-height: 52px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  font-weight: 400;
  text-rendering: optimizeLegibility;
  background: var(--vh-bg);
  color: var(--vh-text);
}
* { box-sizing: border-box; }
html, body { width: 100%; min-width: 0; min-height: 100%; margin: 0; }
body { font-size: 14px; line-height: 1.5; background: var(--vh-bg); }
button, input, textarea, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: default; }
a { color: var(--vh-accent); text-underline-offset: 4px; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--vh-accent); outline-offset: 3px; }
input, textarea, select { accent-color: var(--vh-accent); }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
::selection { color: #fff; background: #796293; }
.vh-sr-only, .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.vh-app { width: 100%; min-height: 100dvh; overflow: clip; }
.vh-skip-link { position: fixed; z-index: 200; top: 8px; left: 12px; padding: 10px 16px; color: var(--vh-accent-ink); background: var(--vh-accent); border-radius: 7px; transform: translateY(-160%); }
.vh-skip-link:focus { transform: none; }
.vh-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.vh-mark { height: 30px; width: 30px; flex-shrink: 0; color: #d7cee5; }
.vh-topbar { min-height: var(--vh-topbar-height); display: flex; align-items: center; gap: 20px; padding: 4px 20px; background: #121419; border-bottom: 1px solid var(--vh-line-soft); }
.vh-topbar>button { min-height: 44px; padding: 0; border: 0; background: none; }
.vh-topbar>.vh-icon-button { width: 44px; margin-left: auto; }
.vh-wordmark { display: inline-flex; align-items: center; gap: 10px; color: var(--vh-text); text-decoration: none; min-width: 0; }
.vh-wordmark>span { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
.vh-wordmark b, .vh-wordmark strong { color: var(--vh-text); font-size: 14px; font-weight: 730; letter-spacing: .075em; line-height: 1.4; }
.vh-wordmark small { color: var(--vh-muted); font-size: 10px; font-weight: 500; letter-spacing: .12em; line-height: 1.4; }
.vh-quick-search { display: flex; align-items: center; justify-content: flex-start; gap: 9px; width: min(410px, 40vw); margin-left: auto; color: var(--vh-muted); font-size: 13px; }
.vh-quick-search kbd { margin-left: auto; color: #9d99aa; font: 11px ui-monospace, monospace; border: 1px solid #45414e; border-radius: 4px; padding: 1px 5px; }
.vh-edition { margin-left: auto; color: var(--vh-muted); font-size: 12px; letter-spacing: .025em; }
.vh-eyebrow { display: block; color: var(--vh-muted); font-size: 12px; font-weight: 600; line-height: 1.5; letter-spacing: .025em; }
.vh-primary, .vh-secondary, .vh-danger, .vh-icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 10px 15px; border: 1px solid transparent; border-radius: 8px; font-size: 14px; font-weight: 560; line-height: 1.45; text-decoration: none; transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
.vh-primary { color: var(--vh-accent-ink); background: var(--vh-accent); border-color: #c9b5e7; }
.vh-primary:hover { background: #d0bceb; border-color: #d6c3ee; }
.vh-secondary { color: #d5d0df; background: #ffffff05; border-color: #514b5d; }
.vh-secondary:hover { color: #f5edf9; background: #ffffff0a; border-color: #7b6b8d; }
.vh-danger { color: var(--vh-danger); background: #bf617011; border-color: #925160; }
.vh-danger:hover { color: #ffd1d9; background: #bf617027; border-color: #c17b89; }
.vh-icon-button { width: 44px; padding: 10px; color: var(--vh-muted); background: transparent; flex-shrink: 0; }
.vh-icon-button:hover { color: var(--vh-text); background: #ffffff08; }
.vh-primary:disabled, .vh-secondary:disabled, .vh-danger:disabled { color: #aaa4b3; border-color: #49434f; background: #80758a18; opacity: .7; }
.vh-primary[aria-busy="true"], .vh-secondary[aria-busy="true"], .vh-form[aria-busy="true"] { cursor: progress; }
.vh-text-button { min-height: 44px; padding: 8px 0; border: 0; background: none; color: var(--vh-accent); font-size: 13px; text-align: left; }
.vh-text-button:hover { text-decoration: underline; text-underline-offset: 4px; }
.vh-primary .vh-icon, .vh-secondary .vh-icon, .vh-danger .vh-icon { height: 18px; width: 18px; }

/* A practical login screen: a short introduction beside the account form. */
.vh-auth { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 420px); justify-content: center; align-items: center; gap: clamp(36px, 6vw, 88px); min-height: calc(100dvh - var(--vh-topbar-height)); padding: 50px 32px; }
.vh-auth-intro { align-self: center; max-width: 330px; }
.vh-auth-intro>.vh-mark { width: 48px; height: 48px; margin-bottom: 23px; color: #c1abe6; }
.vh-auth-intro h1 { color: var(--vh-text); font-size: clamp(30px, 3.2vw, 42px); line-height: 1.16; letter-spacing: -.035em; font-weight: 650; margin: 0 0 16px; text-wrap: balance; }
.vh-auth-intro p { color: var(--vh-muted); max-width: 310px; font-size: 15px; line-height: 1.7; margin: 0; }
.vh-auth-product { display: inline-flex; align-items: baseline; gap: 9px; margin-top: 26px; color: #c4becd; font-size: 12px; font-weight: 650; letter-spacing: .07em; }
.vh-auth-product small { color: var(--vh-muted); font-size: 10px; font-weight: 500; letter-spacing: .08em; }
.vh-auth-card { min-width: 0; padding: 26px 28px 28px; background: #20222a; border: 1px solid #383943; border-radius: 12px; box-shadow: 0 12px 36px #0002; }
.vh-auth>.vh-auth-card:only-child { grid-column: 1 / -1; justify-self: center; width: min(420px, 100%); }
.vh-auth-card h1 { font-size: 25px; font-weight: 650; line-height: 1.2; letter-spacing: -.025em; margin: 0 0 12px; }
.vh-auth-card h2 { font-size: 21px; font-weight: 620; letter-spacing: -.02em; margin: 0 0 10px; }
.vh-auth-card>p { color: var(--vh-muted); font-size: 14px; line-height: 1.65; margin: 0 0 20px; }
.vh-auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 22px; background: #15171c; border: 1px solid #30323c; border-radius: 8px; }
.vh-auth-tabs button { min-height: 42px; border: 0; border-radius: 5px; color: var(--vh-muted); background: none; font-size: 14px; font-weight: 550; }
.vh-auth-tabs button:hover { color: var(--vh-text); background: #ffffff05; }
.vh-auth-tabs .is-active, .vh-auth-tabs [aria-pressed="true"], .vh-auth-tabs [aria-selected="true"] { color: var(--vh-text); background: #36313f; }
.vh-auth .vh-field { margin: 15px 0; }
.vh-auth .vh-form>.vh-primary { width: 100%; margin-top: 6px; }
.vh-auth .vh-form>.vh-error { margin-top: 14px; margin-bottom: 12px; }
.vh-field-help { color: var(--vh-muted); font-size: 12px; line-height: 1.6; margin: -7px 0 15px; }
.vh-auth-footer { display: flex; justify-content: center; align-items: center; gap: 8px 14px; flex-wrap: wrap; color: var(--vh-muted); font-size: 12px; padding-top: 17px; margin-top: 20px; border-top: 1px solid #35343e; }
.vh-auth-footer p { margin: 0; font-size: 12px; }
.vh-auth-footer .vh-text-button { padding: 4px 0; min-height: 36px; }
.vh-password-field { position: relative; display: flex; align-items: center; margin-top: 7px; }
.vh-password-field input { padding-right: 72px !important; margin-top: 0 !important; }
.vh-password-field>.vh-text-button { position: absolute; right: 4px; min-width: 60px; min-height: 42px; padding: 5px 9px; color: #c7bdd4; font-size: 12px; text-align: center; }
.vh-auth-card .vh-recovery-code { display: block; width: 100%; min-height: 98px; resize: none; padding: 14px; background: #111318; border: 1px solid #60546e; border-radius: 8px; color: #eee5f7; font: 15px/1.7 ui-monospace, monospace; overflow-wrap: anywhere; }
.vh-auth-card>.vh-primary, .vh-auth-card>.vh-secondary { width: 100%; margin-top: 10px; }
.vh-note, .vh-session-status { color: var(--vh-muted); font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
.vh-note b { display: block; color: var(--vh-copy); margin-bottom: 5px; font-weight: 600; }
.vh-note p { margin: 8px 0; }
.vh-note button { margin: 8px 9px 0 0; }
.vh-error { padding: 11px 13px; color: #f2b6c2; background: #a6435612; border: 1px solid #8a4d5d; border-radius: 7px; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
.vh-error:empty { display: none; }
.vh-boot { display: grid; min-height: calc(100dvh - var(--vh-topbar-height)); place-content: center; gap: 16px; text-align: center; color: var(--vh-muted); }
.vh-boot>.vh-mark { width: 48px; height: 48px; margin: auto; }
.vh-onboarding { max-width: 580px; padding: 50px 28px; margin: 0 auto; }
.vh-onboarding h1 { font-size: 30px; font-weight: 620; line-height: 1.2; letter-spacing: -.025em; margin: 14px 0; }
.vh-onboarding>p { color: var(--vh-copy); line-height: 1.7; }
.vh-security-mark { display: flex; margin: 20px 0; color: var(--vh-accent); }
.vh-security-mark svg { width: 36px; height: 36px; }

/* The rail follows Discord's hierarchy; the conversation list stays compact. */
.vh-layout { display: grid; grid-template-columns: 68px 280px minmax(0, 1fr); height: calc(100dvh - var(--vh-topbar-height)); min-height: 0; }
.vh-layout.has-details { grid-template-columns: 68px 280px minmax(0, 1fr) 240px; }
.vh-layout[data-view="you"] { grid-template-columns: 68px minmax(0, 1fr); }
.vh-rail { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 9px; background: var(--vh-rail); border-right: 1px solid #252731; overflow-y: auto; scrollbar-width: thin; }
.vh-rail button, .vh-rail a { position: relative; display: grid; place-items: center; width: 46px; height: 46px; min-height: 46px; flex-shrink: 0; padding: 9px; border: 1px solid #ffffff0c; border-radius: 15px; background: #262832; color: #bfc0cc; font-size: 14px; font-weight: 600; text-decoration: none; }
.vh-rail button:hover, .vh-rail a:hover { background: #3c334b; color: #ede6f9; border-color: #ae91d13a; }
.vh-rail .is-active, .vh-rail [aria-current="page"] { color: #f0e5ff; background: #70578f; border-color: #9f83be; border-radius: 14px; }
.vh-rail .is-active:before, .vh-rail [aria-current="page"]:before { content: ""; position: absolute; left: -10px; width: 3px; height: 24px; border-radius: 0 3px 3px 0; background: #e5d5f5; }
.vh-rail>span:empty { width: 28px; height: 1px; background: #36323e; margin: 2px 0; }
.vh-rail .vh-rail-server { border-radius: 50%; background: #31303a; }
.vh-rail .vh-rail-server.is-active, .vh-rail .vh-rail-server:hover { border-radius: 14px; background: #70578f; }
.vh-rail-server>span { overflow: hidden; text-overflow: clip; max-width: 100%; white-space: nowrap; }
.vh-rail-you, .vh-rail-bottom { margin-top: auto; }
.vh-sidebar { display: flex; flex-direction: column; gap: 0; min-width: 0; padding: 14px 10px; background: var(--vh-side); border-right: 1px solid var(--vh-line); overflow-y: auto; scrollbar-width: thin; }
.vh-sidebar>header, .vh-sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 44px; margin: 0 4px 10px; }
.vh-sidebar h2 { margin: 0; color: var(--vh-text); font-size: 17px; font-weight: 650; line-height: 1.4; letter-spacing: -.02em; overflow-wrap: anywhere; }
.vh-sidebar>header>.vh-icon-button { width: 40px; height: 44px; }
.vh-sidebar-description, .vh-sidebar-quiet, .vh-sidebar>p { color: var(--vh-muted); font-size: 13px; line-height: 1.65; margin: 7px 8px 16px; }
.vh-sidebar>.vh-primary, .vh-sidebar>.vh-secondary { margin: 4px 6px; width: calc(100% - 12px); }
.vh-sidebar>.vh-nav-list { flex: 1; }
.vh-sidebar>footer { display: flex; align-items: center; gap: 10px; min-height: 63px; margin: auto -10px -14px; padding: 12px; background: #111319; border-top: 1px solid #292a33; }
.vh-sidebar>footer>button { min-width: 0; min-height: 44px; padding: 4px 0; color: var(--vh-copy); border: 0; background: none; text-align: left; }
.vh-sidebar>footer b, .vh-sidebar>footer small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
.vh-sidebar>footer b { font-size: 13px; font-weight: 600; }
.vh-sidebar>footer small { font-size: 12px; color: var(--vh-muted); }
.vh-nav-list { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.vh-nav-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 9px 11px; color: #b7b7c4; border: 1px solid transparent; border-radius: 7px; background: none; text-align: left; font-size: 14px; line-height: 1.45; text-decoration: none; }
.vh-nav-item>span:not(.vh-avatar) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.vh-nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.vh-nav-item:hover { color: var(--vh-text); background: #ffffff07; }
.vh-nav-item.is-active, .vh-nav-item[aria-current="page"] { color: #eee8fa; background: #55446c68; border-color: #af91d023; }
.vh-nav-item small { margin-left: auto; color: var(--vh-muted); font-size: 12px; }
.vh-server-monogram { display: inline-grid; place-items: center; width: 30px; min-width: 30px; height: 30px; background: #39303f; border: 1px solid #6d5a7e66; border-radius: 9px; color: #d2bfeb; font-size: 12px; font-weight: 600; }
.vh-main { min-width: 0; min-height: 0; position: relative; overflow-y: auto; background: var(--vh-bg); scrollbar-gutter: stable; }
.vh-main:focus:not(:focus-visible) { outline: none; }

/* Durable local operation journal. A successful mutation is one atomic setItem;
   independent tabs never overwrite the same operation key. No media checkpoint
   is rewritten on every action. Legacy archive is retained for recovery. */
(() => {
  'use strict';
  const copy = value => JSON.parse(JSON.stringify(value));
  const objects = (list, id = 'id') => Object.fromEntries((list || []).map(item => [item[id], item]));
  function encode(state) {
    const value = copy(state);
    value.messages = Object.fromEntries(Object.entries(value.messages || {}).map(([key, list]) => [key, objects(list)]));
    value.customServers = objects(value.customServers);
    Object.values(value.customServers).forEach(server => {server.channels = Object.fromEntries((server.channels || []).map(([id, description], order) => [id, {description, order}]));});
    value.conversations = objects(value.conversations);
    value.notifications = objects(value.notifications);
    for (const field of ['friends','deleted','artifactInspected']) value[field] = Object.fromEntries((value[field] || []).map(id => [id, true]));
    return value;
  }
  function decode(encoded) {
    const value = copy(encoded);
    value.messages = Object.fromEntries(Object.entries(value.messages || {}).map(([key, records]) => [key, Object.values(records).filter(m => m && m.id).sort((a,b) => a.time-b.time || a.id.localeCompare(b.id))]));
    value.customServers = Object.values(value.customServers || {});
    value.customServers.forEach(server => {server.channels = Object.entries(server.channels || {}).sort((a,b) => (a[1].order||0)-(b[1].order||0)||a[0].localeCompare(b[0])).map(([id, c]) => [id, c.description || '']);});
    value.conversations = Object.values(value.conversations || {});
    value.notifications = Object.values(value.notifications || {}).sort((a,b) => a.time-b.time);
    for(const field of ['friends','deleted','artifactInspected'])value[field] = Object.keys(value[field] || {}).filter(id => value[field][id]);
    const deleted = new Set(value.deleted);
    Object.keys(value.messages).forEach(key => {value.messages[key] = value.messages[key].filter(m => !deleted.has(m.id));});
    return value;
  }
  function flatten(value, path = [], result = new Map()) {
    if(value && typeof value === 'object' && !Array.isArray(value) && Object.keys(value).length) {
      Object.entries(value).forEach(([key, child]) => flatten(child, [...path,key], result));
    } else result.set(JSON.stringify(path), value);
    return result;
  }
  function set(root, path, value, remove) {
    if(!path.length)return;
    let at = root;
    for(let i=0;i<path.length-1;i++){const key=path[i];if(['__proto__','constructor','prototype'].includes(key))throw Error('Invalid archive path');if(!at[key] || typeof at[key] !== 'object' || Array.isArray(at[key]))at[key]={};at=at[key];}
    const key=path[path.length-1];if(['__proto__','constructor','prototype'].includes(key))throw Error('Invalid archive path');if(remove)delete at[key];else at[key]=copy(value);
  }
  function create(storage, legacyKey='voidline.local.v1') {
    const prefix='voidline.archive.v3.', baseKey=prefix+'base', opPrefix=prefix+'op.';
    const writer=globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2)+Date.now();
    let sequence=0, clock=0, baseline=new Map(), latest={};
    const legacy=()=>JSON.parse(storage.getItem(legacyKey)||'{}');
    let cacheBase=null,cacheEncoded=null,seen=new Set(),revisions=new Map();
    function read() {
      const base=storage.getItem(baseKey),rawBase=base===null?storage.getItem(legacyKey)||'{}':base;
      const keys=[];for(let i=0;i<storage.length;i++){const key=storage.key(i);if(key?.startsWith(opPrefix))keys.push(key);}
      if(cacheBase!==rawBase||!cacheEncoded||keys.length<seen.size){cacheBase=rawBase;cacheEncoded=encode(JSON.parse(rawBase));seen=new Set();revisions=new Map();}
      const operations=[];
      for(const key of keys)if(!seen.has(key)){const op=JSON.parse(storage.getItem(key));if(!op||op.schema!==3||!Number.isFinite(op.clock)||!Array.isArray(op.changes))throw Error('Invalid operation journal');operations.push({key,op});}
      operations.sort((a,b)=>a.op.clock-b.op.clock||a.op.id.localeCompare(b.op.id));
      for(const {key,op}of operations){clock=Math.max(clock,op.clock);for(const patch of op.changes){const path=JSON.stringify(patch.path),revision=revisions.get(path);if(!revision||op.clock>revision.clock||(op.clock===revision.clock&&op.id>revision.id)){set(cacheEncoded,patch.path,patch.value,patch.remove);revisions.set(path,{clock:op.clock,id:op.id});}}seen.add(key);}
      return decode(cacheEncoded);
    }
    function load(fallback={}) {
      latest=read();if(!Object.keys(latest).length)latest=copy(fallback);
      baseline=flatten(cacheEncoded||encode(latest));return copy(latest);
    }
    function commit(candidate) {
      let changesForRetry=[];
      try {
        const target=flatten(encode(candidate)),changes=[];
        for(const [key,value]of target){if(!baseline.has(key)||JSON.stringify(baseline.get(key))!==JSON.stringify(value))changes.push({path:JSON.parse(key),value});}

        // They never become new shared operations; active navigation belongs to sessionStorage.
        // Empty container markers must never erase an entity added by another tab.
        const actual=changes.filter(p=>!['server','channel','readingPositions'].includes(p.path[0])).filter(p=>!(p.remove && baseline.get(JSON.stringify(p.path)) && typeof baseline.get(JSON.stringify(p.path))==='object' && !Array.isArray(baseline.get(JSON.stringify(p.path))) && !Object.keys(baseline.get(JSON.stringify(p.path))).length)).filter(p=>!(p.value && typeof p.value==='object' && !Array.isArray(p.value) && !Object.keys(p.value).length));

        if(actual.length){const id=writer+'-'+(++sequence);const op={schema:3,id,clock:Math.max(Date.now(),clock+1),changes:actual};storage.setItem(opPrefix+id,JSON.stringify(op));clock=op.clock;}
        latest=read();baseline=flatten(cacheEncoded||encode(latest));return {ok:true,state:copy(latest)};
      } catch(error) {return {ok:false,error:String(error?.message||error),state:copy(latest),patch:changesForRetry};}
    }
    function retry(changes){try{const current=read();if(!storage.getItem(baseKey))storage.setItem(baseKey,JSON.stringify(current));const id=writer+'-'+(++sequence);const op={schema:3,id,clock:Math.max(Date.now(),clock+1),changes};storage.setItem(opPrefix+id,JSON.stringify(op));clock=op.clock;latest=read();baseline=flatten(cacheEncoded||encode(latest));return {ok:true,state:copy(latest)};}catch(error){return{ok:false,error:String(error?.message||error)};}}
    return {load,commit,retry,read,keys:{baseKey,opPrefix},get committed(){return copy(latest);}};
  }
  window.VoidStore={create,recover(data){let encoded=encode(data.state||JSON.parse(data.legacyArchive||'{}'));for(const item of data.pending||[])for(const patch of item.patch||[])set(encoded,patch.path,patch.value,patch.remove);return decode(encoded);}};
})();

  function accountPage() {return `<div class="vh-page-content"><header class="vh-page-header"><span class="vh-eyebrow">ACCOUNT</span><h1>Your profile</h1><p>Your identity, preferences, devices and data.</p></header><div class="vh-profile-preview" data-theme="${esc(state.account.theme||'obsidian')}"><span class="vh-avatar">${esc(state.account.displayName.slice(0,1).toUpperCase())}</span><h2>${esc(state.account.displayName)}</h2><button class="vh-username" data-home="copy-username">@${esc(state.account.username)} ${icon('copy')}</button><p>${esc(state.account.bio||'Add a bio in your profile settings.')}</p>${state.account.status?`<small>${esc(state.account.status)}</small>`:''}</div>${extensions.map(module=>module.accountHTML?.()||'').join('')}<div class="vh-settings-list"><button data-home="profile">${icon('you')}<span><b>Profile</b><small>Display name, bio and avatar mark</small></span>${icon('arrow')}</button><button data-home="appearance">${icon('settings')}<span><b>Appearance & accessibility</b><small>Font size, contrast and motion</small></span>${icon('arrow')}</button><button data-home="change-password">${icon('shield')}<span><b>Password</b><small>Change your account password</small></span>${icon('arrow')}</button><button data-home="security">${icon('shield')}<span><b>Devices & security</b><small>Sessions, verification and recovery status</small></span>${icon('arrow')}</button><button data-home="saved">${icon('bookmark')}<span><b>Saved Messages</b><small>Your personal utility, separate from chats</small></span>${icon('arrow')}</button><button data-home="data">${icon('download')}<span><b>Data & previous archive</b><small>Deliberate recovery and export</small></span>${icon('arrow')}</button><button data-home="logout">${icon('signout')}<span><b>Sign out</b><small>Lock account content on this device</small></span></button></div></div>`;}
  function conversation() {const c=channel();return `<header class="vh-page-header vh-conversation-header"><button class="vh-icon-button vh-mobile-back" data-home="back-server" aria-label="Back to channels">${icon('back')}</button><div><span class="vh-eyebrow">${esc(community()?.name)}</span><h1># ${esc(c?.name||'Channel')}</h1></div><button class="vh-icon-button" data-home="members" aria-label="Show members">${icon('you')}</button></header><div class="vh-note vh-legacy-note"><b>Previous unencrypted history</b><span>These records predate protected messaging. New messages are blocked until end-to-end encryption is ready.</span></div><div id="home-feed" class="vh-feed" tabindex="0" aria-label="Previous channel history">${state.loading?'<p role="status">Loading history…</p>':state.error?`<div class="vh-error" role="alert">${esc(state.error)}<button class="vh-secondary" data-home="retry-channel">Retry</button></div>`:`${state.older?'<button class="vh-secondary" data-home="older">Load earlier messages</button>':''}${state.messages.length?state.messages.map(m=>`<article class="vh-message"><span class="vh-avatar">${esc((m.author_name||'?').slice(0,1))}</span><div><header><b>${esc(m.author_name||'Resident')}</b><time>${esc(time(m.created_at))}</time>${m.edited_at?'<small>edited</small>':''}</header><div class="vh-message-text">${m.deleted_at?'<em>This message was deleted.</em>':esc(m.text)}</div></div></article>`).join(''):'<div class="vh-history-empty"><h2>No messages</h2><p>There are no previous messages here.</p></div>'}`}</div><div class="vh-composer-blocked">${icon('shield')}<div><b>Protected sending is unavailable</b><span>Device keys and encrypted delivery have not been configured.</span></div><button class="vh-secondary" data-home="security">View security status</button></div>`;}
  function destinationEmpty(){if(!state.communities.length&&!state.secureRooms.length)return emptyHome();return `<div class="vh-empty"><span class="vh-empty-mark">${icon(state.view==='servers'?'servers':'chats')}</span><span class="vh-eyebrow">YOUR WORKSPACE</span><h1>${state.view==='servers'?(community()?'Choose a channel.':'Choose a server'):'Select a chat'}</h1><p>${state.view==='servers'?'Open a server and choose its channel to see its available history.':'Choose an encrypted conversation from your list, or intentionally start a new one.'}</p><button class="vh-secondary" data-home="${state.view==='servers'?'join':'new-secure-room'}">${state.view==='servers'?'Join another server':'New encrypted conversation'}</button></div>`;}
  function shell() {return `<div class="vh-layout ${(state.channelId||state.secureRoomId)?'is-conversation':''}" data-view="${state.view}" data-has-locations="${state.view==='servers'?state.communities.length>0:state.secureRooms.length>0}"><nav class="vh-rail" aria-label="Main navigation"><button class="${state.view==='chats'?'is-active':''}" data-home="chats" aria-label="Chats">${icon('chats')}</button><button class="${state.view==='servers'?'is-active':''}" data-home="servers" aria-label="Servers">${icon('servers')}</button><span class="vh-rail-divider"></span>${state.communities.map(c=>`<button class="vh-rail-server ${state.communityId===c.id?'is-active':''}" data-home-community="${esc(c.id)}" aria-label="Open ${esc(c.name)}" title="${esc(c.name)}"><span>${esc((c.icon||c.name).slice(0,2))}</span></button>`).join('')}<button data-home="create" aria-label="Create a server">${icon('plus')}</button><button class="vh-rail-you ${state.view==='you'?'is-active':''}" data-home="you" aria-label="Your profile">${icon('you')}</button></nav>${state.view!=='you'?sidebar():''}<main id="home-main" class="vh-main ${(state.channelId||state.secureRoomId)?'vh-conversation':''}" tabindex="-1">${state.view==='you'?accountPage():state.view==='servers'&&state.channelId?conversation():state.view==='chats'&&state.secureRoomId?secureConversation():destinationEmpty()}</main></div><nav class="vh-bottom-nav" aria-label="Main navigation">${['chats','servers','you'].map(view=>`<button data-home="${view}" class="${state.view===view?'is-active':''}" ${state.view===view?'aria-current="page"':''}>${icon(view)}<span>${view==='you'?'Profile':view[0].toUpperCase()+view.slice(1)}</span></button>`).join('')}</nav>`;}
  function render() {
    if(!root)return;
    const previous=renderedContext,input=$('home-secure-input');
    const sameConversation=state.phase==='ready'&&state.view==='chats'&&!!state.secureRoomId&&previous?.accountId===state.account?.id&&previous?.roomId===state.secureRoomId;
    if(input&&previous?.accountId===state.account?.id&&previous?.roomId){const draft=state.secureDrafts.get(previous.roomId);if(draft)draft.text=input.value;}
    // Inventory/friend refreshes must not interrupt typing or IME composition.
    // The conversation feed has its own targeted update path.
    if(sameConversation&&input&&document.activeElement===input){applyPreferences();return;}
    const feed=sameConversation?$('home-secure-feed'):null,position=feed?{top:feed.scrollTop,bottom:feed.scrollHeight-feed.clientHeight-feed.scrollTop<80}:null;
    root.setAttribute('aria-busy',String(state.phase==='loading'));
    root.innerHTML=topbar()+(state.phase==='loading'?'<main id="home-main" class="vh-boot" aria-busy="true">'+mark+'<p role="status">Opening Voidline…</p></main>':state.phase==='welcome'?welcome():state.phase==='account-recovery'?accountRecovery():state.phase==='onboarding'?onboarding():shell());
    renderedContext={accountId:state.account?.id||null,roomId:state.phase==='ready'&&state.view==='chats'?state.secureRoomId:null};
    if(state.account)applyPreferences();
    if(position){const next=$('home-secure-feed');if(next)next.scrollTop=position.bottom?next.scrollHeight:position.top;}
  }
  function time(value) {const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'Time unavailable';}
  function closeDialog(restore=true){if(recoveryAcknowledgement){const resolve=recoveryAcknowledgement;recoveryAcknowledgement=null;resolve(false);}state.dialogGeneration++;if(dialog?.open)dialog.close();if(restore&&priorFocus?.isConnected)priorFocus.focus();priorFocus=null;}
  function showDialog(title,copy,html){state.dialogGeneration++;if(!dialog.open)priorFocus=document.activeElement;dialog.innerHTML=`<button class="vh-icon-button vh-dialog-close" data-home="close-dialog" aria-label="Close dialog">${icon('close')}</button><div class="vh-dialog-body"><h2 id="home-dialog-title">${esc(title)}</h2>${copy?`<p>${esc(copy)}</p>`:''}${html}</div>`;dialog.setAttribute('aria-labelledby','home-dialog-title');if(!dialog.open)dialog.showModal();requestAnimationFrame(()=>dialog.querySelector('[autofocus],input,button')?.focus());return state.dialogGeneration;}
  function errorNode(error,form){if(error.code==='reauthentication_required'){reauthenticateDialog();return;}const node=form?.querySelector('[data-form-error]')||dialog.querySelector('[data-form-error]');if(node)node.textContent=error.message;else announce(error.message);}
  const formError='<p class="vh-error" data-form-error role="alert"></p>';
  function createDialog(){showDialog('Create a server','A new server starts with only you. Creating it also creates its first text channel.',`<form data-home-form="create" class="vh-form"><label class="vh-field">Server name<input name="name" maxlength="64" required autofocus></label><label class="vh-field">Description <span>Optional</span><textarea name="description" maxlength="240" rows="3"></textarea></label><label class="vh-field">Icon text <span>Up to 8 characters</span><input name="icon" maxlength="8" value="WL"></label>${formError}<button class="vh-primary" type="submit">Create server</button></form>`);}
  function joinDialog(token=''){showDialog('Join a server','Review the server before choosing to join. Opening an invitation never adds membership.',`<form data-home-form="preview-invite" class="vh-form"><label class="vh-field">Invitation link or code<input name="token" value="${esc(token)}" required autocomplete="off" spellcheck="false" autofocus></label>${formError}<button class="vh-primary" type="submit">Review invitation</button></form>`);}
  function inviteToken(value){const input=String(value||'').trim();if(/^[a-f0-9]{64}$/.test(input))return input;try{const url=new URL(input);return /^#join=([a-f0-9]{64})$/.exec(url.hash)?.[1]||/^\/invite\/([a-f0-9]{64})\/?$/.exec(url.pathname)?.[1]||'';}catch(_){return '';}}
  function friendDialog(){if(secureReady())return newSecureRoom();showDialog('New conversation','Friend requests and direct messages become available with the encrypted messaging service.',`<div class="vh-note"><b>No request has been sent.</b><p>Device verification and encrypted delivery must be configured before a private conversation can start.</p></div><button class="vh-secondary" data-home="security">View security status</button>`);}
  async function previewInvite(token){const current=guard();const ticket=state.dialogGeneration;const data=await request('/api/live/invites/'+encodeURIComponent(token));if(!current()||ticket!==state.dialogGeneration)return;const invite=data.invite;showDialog(invite.name||invite.communityName||'Server invitation',invite.description||'An invitation-only server.',`<div class="vh-note"><b>${esc(invite.icon||'WL')}</b><p>${invite.alreadyMember?'You already belong to this server.':`Invitation ${esc(invite.state||'available')}${invite.expiresAt?' · expires '+esc(time(invite.expiresAt)):''}`}</p><p>Joining shares your chosen profile with its members. New protected messages remain unavailable until encryption is ready.</p></div><form data-home-form="join" data-token="${esc(token)}">${formError}<button class="vh-primary" type="submit" ${invite.state&&invite.state!=='active'&&!invite.alreadyMember?'disabled':''}>${invite.alreadyMember?'Open server':'Join this server'}</button></form>`);}
  async function refreshCommunities(){const current=guard();const data=await request('/api/live/communities');if(!current())return false;state.communities=Array.isArray(data.communities)?data.communities:[];return true;}
  async function openCommunity(id,preferred=null){if(!state.communities.some(c=>c.id===id))return;state.generation++;const current=guard();state.view='servers';state.secureRoomId=null;state.secureMessages=[];state.communityId=id;state.channelId=null;state.messages=[];state.members=[];state.channels=[];state.error='';render();try{const data=await request(`/api/live/communities/${encodeURIComponent(id)}/channels`);if(!current())return;state.channels=data.channels||[];render();remember();if(preferred&&state.channels.some(c=>c.id===preferred))await openChannel(preferred);}catch(error){if(current()){state.error=error.message;announce(error.message);}}}
  async function openChannel(id){if(!state.channels.some(c=>c.id===id))return;const old=$('home-feed');if(old&&state.channelId)state.readPositions.set(state.channelId,old.scrollTop);state.generation++;const current=guard();state.channelId=id;state.view='servers';state.messages=[];state.error='';state.loading=true;state.older=false;render();remember();history.replaceState(null,'',location.pathname+location.search+'#servers/'+encodeURIComponent(state.communityId)+'/channels/'+encodeURIComponent(id));try{const data=await request(`/api/live/channels/${encodeURIComponent(id)}/messages?limit=50`);if(!current())return;state.messages=data.messages||[];state.older=!!data.page?.hasMore;}catch(error){if(current())state.error=error.message;}finally{if(current()){state.loading=false;render();const feed=$('home-feed');if(feed)feed.scrollTop=state.readPositions.get(id)??feed.scrollHeight;}}}
  async function olderMessages(button){if(!state.channelId||!state.messages.length||!state.older)return;const current=guard(),id=state.channelId,feed=$('home-feed'),top=feed?.scrollTop||0,height=feed?.scrollHeight||0;if(button)button.disabled=true;try{const data=await request(`/api/live/channels/${encodeURIComponent(id)}/messages?before=${state.messages[0].seq}&limit=50`);if(!current())return;const all=new Map([...data.messages,...state.messages].map(m=>[m.id,m]));state.messages=[...all.values()].sort((a,b)=>a.seq-b.seq);state.older=!!data.page?.hasMore;render();const next=$('home-feed');if(next)next.scrollTop=top+next.scrollHeight-height;}catch(error){if(current())announce(error.message);}finally{if(button?.isConnected)button.disabled=false;}}
  function view(name){state.generation++;state.view=name;state.secureRoomId=null;state.secureMessages=[];state.channelId=null;state.communityId=null;state.channels=[];state.messages=[];state.members=[];state.error='';closeDialog(false);render();remember();history.replaceState(null,'',location.pathname+location.search+'#'+name);$('home-main')?.focus();}
  async function security(){const current=guard();const ticket=showDialog('Devices & security.','Account sessions and encryption devices have different purposes.',`<div id="home-security" role="status">Loading your sessions…</div>${formError}`);try{const data=await request('/api/auth/devices');if(!current()||ticket!==state.dialogGeneration)return;const target=$('home-security');if(!target)return;target.innerHTML=`<div class="vh-note"><b>${secureReady()?'Encrypted messaging connected':'Encrypted messaging not connected'}</b><p>${secureReady()?'Messaging identity: '+esc(state.secureStatus.userId)+' / '+esc(state.secureStatus.deviceId):'No verified messaging keys are enrolled through this account session.'}</p><p>Voidline login sessions are separate from messaging devices. Revoking a session locks this app; it does not revoke a Matrix token used by another client.</p></div><div class="vh-dialog-actions">${secureReady()?'<button class="vh-secondary" data-home="secure-verify">Verify devices</button><button class="vh-secondary" data-home="secure-fingerprint">This device fingerprint</button><button class="vh-secondary" data-home="secure-recovery">Set up recovery</button><button class="vh-secondary" data-home="secure-restore">Restore backup</button><button class="vh-danger" data-home="secure-disconnect-confirm">Disconnect messaging</button>':'<button class="vh-primary" data-home="secure-connect">Connect encrypted messaging</button>'}</div><h3>Active sessions</h3><div class="vh-result-list">${(data.devices||[]).map(d=>`<article class="vh-list-row"><div><b>${esc(d.deviceName||'Browser session')}${d.current?' · this session':''}</b><p>Last active ${esc(time(d.lastActiveAt))}</p><small>Signed in ${esc(time(d.createdAt))}</small></div><button class="vh-danger" data-home-revoke="${esc(d.id)}">${d.current?'Sign out':'Revoke session'}</button></article>`).join('')}</div><button class="vh-secondary" data-home="reauthenticate">Confirm your password</button><button class="vh-secondary" data-home="change-password">Change password</button>`;}catch(error){if(current()&&ticket===state.dialogGeneration)errorNode(error);}}
  function profileDialog(){const p=state.account;showDialog('Edit profile','Only the information you choose is visible to other server members.',`<form class="vh-form" data-home-form="profile"><label class="vh-field">Username<input value="${esc(p.username)}" readonly></label><label class="vh-field">Display name<input name="displayName" value="${esc(p.displayName)}" minlength="2" maxlength="32" required></label><label class="vh-field">Bio<textarea name="bio" rows="3" maxlength="240">${esc(p.bio||'')}</textarea></label><label class="vh-field">Status<input name="status" value="${esc(p.status||'')}" maxlength="80"></label><div class="vh-form-grid"><label class="vh-field">Theme<select name="theme">${['obsidian','lilac','ice'].map(v=>`<option ${p.theme===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="vh-field">Avatar mark<select name="avatar">${['moon','orbit','spark','leaf','ghost'].map(v=>`<option ${p.avatar===v?'selected':''}>${v}</option>`).join('')}</select></label></div>${formError}<p class="vh-note">No artifacts are granted for choosing a profile. Cosmetics do not confer staff roles.</p><button class="vh-primary" type="submit">Save profile</button></form>`);}
  function appearance(){const p=preferences();showDialog('Appearance & accessibility','These reading preferences are saved for this account on this device.',`<form class="vh-form" data-home-form="appearance"><label class="vh-field">Text size<select name="font"><option value="15" ${p.font==='15'?'selected':''}>Comfortable · 15px</option><option value="17" ${p.font==='17'?'selected':''}>Large · 17px</option><option value="19" ${p.font==='19'?'selected':''}>Extra large · 19px</option></select></label><label class="vh-check"><input type="checkbox" name="highContrast" ${p.highContrast?'checked':''}>High contrast</label><label class="vh-check"><input type="checkbox" name="reducedMotion" ${p.reducedMotion?'checked':''}>Reduce motion</label>${formError}<button class="vh-primary" type="submit">Save preferences</button></form>`);}

  function dataDialog(){showDialog('Your data','Previous device-local archives are never uploaded into your account automatically.',`<div class="vh-note"><b>Previous local archive</b><p>Export the untouched records from this browser for review. Existing fixtures and genuine contributions remain in the original archive; this action does not turn samples into account conversations.</p><button class="vh-secondary" data-home="review-local">Review previous archive</button><button class="vh-secondary" data-home="export-local">Export previous local archive</button></div><p>Shared account data and previous unencrypted server history are preserved. Full account export is not available in this release. You can delete your account after transferring any servers you own.</p><a class="vh-secondary" href="downloads/voidline-source.zip" download>Download source</a><button class="vh-danger" data-home="delete-account">Delete account</button>`);}
  function exportLocal(){try{const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key==='voidline.local.v1'||key==='voidline.archive.v3.base'||key?.startsWith('voidline.archive.v3.op.'))keys.push(key);}if(!keys.length)return announce('No previous local archive was found in this browser.');const records=Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]));const data=JSON.stringify({format:'voidline-untouched-browser-records',version:1,records},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='voidline-previous-local-archive.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);announce('Previous local records exported. Nothing was imported or uploaded.');}catch(_){announce('This browser could not read its previous archive. No records were changed.');}}

  async function connectSecure(form,data){const accountId=state.account?.id;if(!accountId)throw Error('Sign in before connecting a messaging device.');const config=matrixConfig();if(!config.configured||data.homeserver!==config.homeserver)throw Error('Use the configured messaging homeserver.');if(String(data.storagePassword||'').length<16)throw Error('Use at least 16 characters for the local storage password.');const module=await loadSecure();if(state.account?.id!==accountId)return;await disconnectSecure(false);if(state.account?.id!==accountId)return;let messenger;const active=()=>state.account?.id===accountId&&state.secure===messenger;messenger=module.create({onState(snapshot){if(!active())return;state.secureStatus=snapshot;if(snapshot.error)announce(snapshot.error);if(snapshot.phase==='ready')refreshSecureRooms().catch(error=>announce(error.message));},onEvent(event){if(!active())return;if(event.roomId===state.secureRoomId)refreshSecureMessages().catch(error=>announce(error.message));refreshSecureRooms(false).catch(()=>{});},onVerification(event){if(active()){state.verification=event;verificationDialog(event);}}});state.secure=messenger;state.secureStatus={phase:'connecting'};const credentials={homeserver:data.homeserver,accountId,accessToken:data.accessToken,storagePassword:data.storagePassword};form.reset?.();closeDialog(false);announce('Connecting to your messaging homeserver…');try{await messenger.connect(credentials);if(!active()){await messenger.disconnect({revokeSession:false});return;}state.secureStatus=messenger.status();await refreshSecureRooms();if(active()){render();announce('Messaging device connected. Verify device identities before sending.');}}catch(error){if(active()){state.secureError=error.message;showDialog('Messaging could not connect.','Your account remains signed in. No protected message has been sent.',`<p class="vh-error">${esc(error.message)}</p><button class="vh-primary" data-home="secure-connect">Try connection again</button>`);}throw error;}finally{credentials.accessToken='';credentials.storagePassword='';}}
  async function refreshSecureRooms(renderNow=true){const messenger=state.secure;if(!messenger)return;const accountId=state.account?.id;const rooms=await messenger.listRooms();if(state.secure!==messenger||state.account?.id!==accountId)return;state.secureRooms=rooms.filter(r=>r.encrypted===true);if(renderNow&&!state.secureRoomId)render();}
  function secureDraft(){const id=state.secureRoomId;if(!id)return null;if(!state.secureDrafts.has(id))state.secureDrafts.set(id,{text:'',pending:null,busy:false,error:''});return state.secureDrafts.get(id);}
  function captureSecureDraft(){const input=$('home-secure-input'),id=renderedContext?.accountId===state.account?.id?renderedContext.roomId:state.secureRoomId,draft=id?state.secureDrafts.get(id):null;if(input&&draft)draft.text=input.value;}
  async function openSecureRoom(id){if(!state.secureRooms.some(r=>r.id===id))return;captureSecureDraft();state.generation++;state.secureRoomId=id;state.secureMessages=[];state.secureError='';state.secureLoading=true;state.channelId=null;state.communityId=null;state.view='chats';render();await refreshSecureMessages();}

  function secureFeedHTML(){return state.secureLoading?'<p role="status">Opening encrypted history…</p>':state.secureError?`<p class="vh-error">${esc(state.secureError)}</p>`:`<button class="vh-secondary" data-home="secure-older">Load earlier encrypted messages</button>${state.secureMessages.length?state.secureMessages.map(m=>`<article class="vh-message ${m.sender===state.secureStatus?.userId?'is-own':''}" data-secure-event="${esc(m.id)}"><span class="vh-avatar">${esc((m.sender||'?').replace(/^@/,'').slice(0,1))}</span><div><header><b>${esc(m.sender||'Messaging identity')}</b><time>${esc(time(m.time))}</time>${m.edited?'<small>edited</small>':''}</header><div class="vh-message-text">${m.type==='unavailable'?'<em>This message cannot be decrypted on this device.</em>':m.type==='deleted'?'<em>This message was deleted.</em>':esc(m.text||'')}</div></div></article>`).join(''):'<div class="vh-history-empty"><h2>No messages yet</h2><p>Verify your recipient’s device before exchanging protected messages.</p></div>'}`;}
  function secureConversation(){const room=state.secureRooms.find(r=>r.id===state.secureRoomId),draft=secureDraft();return `<header class="vh-page-header vh-conversation-header"><button class="vh-icon-button vh-mobile-back" data-home="secure-back" aria-label="Back to chats">${icon('back')}</button><div><span class="vh-eyebrow">ENCRYPTED CHAT</span><h1>${esc(room?.name||'Conversation')}</h1></div><button class="vh-icon-button" data-home="secure-verify" aria-label="Verify messaging devices">${icon('shield')}</button></header><div id="home-secure-feed" class="vh-feed" tabindex="0" aria-label="Encrypted conversation history">${secureFeedHTML()}</div><form data-home-form="secure-message" class="vh-secure-composer"><label class="vh-sr-only" for="home-secure-input">Encrypted message</label><textarea id="home-secure-input" rows="2" maxlength="4000" placeholder="Write a message…">${esc(draft.text)}</textarea><button class="vh-primary" type="submit" ${draft.busy?'disabled':''}>${draft.busy?'Sending…':icon('arrow')}<span class="vh-sr-only">Send encrypted message</span></button></form><div class="vh-compose-status"><span id="home-secure-status" role="status">${esc(draft.error||'Verify recipient devices before sending. Drafts stay in memory while this tab is open.')}</span><button class="vh-text-button" data-home="secure-retry" id="home-secure-retry" ${draft.pending&&!draft.busy?'':'hidden'}>Retry unconfirmed message</button><button class="vh-text-button" data-home="secure-verify">Verify keys</button></div>`;}
  function renderSecureFeed(){const feed=$('home-secure-feed');if(!feed)return;const atBottom=feed.scrollHeight-feed.clientHeight-feed.scrollTop<80,top=feed.scrollTop;feed.innerHTML=secureFeedHTML();feed.scrollTop=atBottom?feed.scrollHeight:top;}
  async function sendSecure(retry=false){const initiating={accountId:state.account?.id,messenger:state.secure,roomId:state.secureRoomId};if(!await checkSession())return;if(state.account?.id!==initiating.accountId||state.secure!==initiating.messenger||state.secureRoomId!==initiating.roomId)return;if(!secureReady()||!state.secureRoomId)return announce('Connect and verify a messaging device before sending.');captureSecureDraft();const messenger=state.secure,id=state.secureRoomId,account=state.account?.id,draft=secureDraft(),text=retry&&draft.pending?draft.pending.text:draft.text.trim();if(!text||draft.busy)return;if(text.length>4000)return announce('Use at most 4,000 characters.');if(draft.pending&&draft.pending.text!==text){draft.error='An earlier message is still unconfirmed. Retry it using the button below; your newer draft will stay here.';updateSecureComposer();return;}if(!draft.pending)draft.pending={text,clientId:crypto.randomUUID()};const pending=draft.pending;draft.busy=true;draft.error='Sending encrypted message…';updateSecureComposer();try{await messenger.sendText(id,pending.text,{clientId:pending.clientId});if(state.secure!==messenger||state.account?.id!==account)return;draft.pending=null;draft.error='Saved by the messaging server. This does not confirm delivery to another device.';if(draft.text.trim()===pending.text)draft.text='';if(id===state.secureRoomId){const input=$('home-secure-input');if(input&&input.value.trim()===pending.text)input.value='';await refreshSecureMessages();input?.focus();}}catch(error){if(state.secure===messenger&&state.account?.id===account){draft.error=error.message+' Your text is still here; retry uses the same message ID.';}}finally{draft.busy=false;if(state.secure===messenger&&id===state.secureRoomId)updateSecureComposer();}}
  function updateSecureComposer(){const draft=secureDraft(),status=$('home-secure-status'),form=document.querySelector('[data-home-form="secure-message"]');if(status&&draft)status.textContent=draft.error||'Verify recipient devices before sending.';const retry=$('home-secure-retry');if(retry&&draft)retry.hidden=!draft.pending||draft.busy;const button=form?.querySelector('[type="submit"]');if(button&&draft){button.disabled=draft.busy;button.setAttribute('aria-busy',String(draft.busy));}}
  async function secureOlder(button){const messenger=state.secure,id=state.secureRoomId,current=guard(),feed=$('home-secure-feed'),top=feed?.scrollTop||0,height=feed?.scrollHeight||0;if(!messenger||!id)return;try{if(button)button.disabled=true;const messages=await messenger.older(id);if(!current()||state.secure!==messenger)return;state.secureMessages=messages;renderSecureFeed();const next=$('home-secure-feed');if(next)next.scrollTop=top+next.scrollHeight-height;}catch(error){if(current())announce(error.message);}finally{if(button?.isConnected)button.disabled=false;}}
  function newSecureRoom(){if(!secureReady())return secureConnect();showDialog('A private conversation.','Choose exact Matrix identities. New rooms use encryption; no one is added automatically.',`<form class="vh-form" data-home-form="secure-create"><label class="vh-field">Conversation title <span>Optional for a direct message</span><input name="name" maxlength="80"></label><label class="vh-field">Participants<span>Exact @name:server identities, one per line. Up to 8 people including you.</span><textarea name="invites" rows="3" placeholder="@friend:example.org" required autofocus></textarea></label><label class="vh-check"><input type="checkbox" name="isDirect" checked>Direct message (one recipient)</label>${formError}<button class="vh-primary" type="submit">Create encrypted conversation</button></form>`);}
  async function createSecureRoom(form,data){const current=guard(),messenger=state.secure;if(!messenger||!secureReady())throw Error('Connect messaging first.');const invites=[...new Set(String(data.invites||'').split(/[\s,]+/).filter(Boolean))];if(!invites.length||invites.length>7||invites.some(id=>!/^@[^:\s]+:[^\s]+$/.test(id)))throw Error('Enter 1–7 exact Matrix identities, such as @friend:example.org.');const direct=data.isDirect==='on';if(direct&&invites.length!==1)throw Error('A direct message has exactly one recipient. Uncheck direct message for a group.');const result=await messenger.createRoom({name:String(data.name||'').trim(),invites,isDirect:direct});if(!current()||messenger!==state.secure)return;closeDialog();await refreshSecureRooms();if(!current())return;const id=typeof result==='string'?result:result.roomId||result.room_id||result.id;if(id)await openSecureRoom(id);}
  async function secureFingerprint(){const current=guard(),messenger=state.secure;if(!messenger)return secureConnect();const fingerprint=await messenger.fingerprint();if(!current()||messenger!==state.secure)return;showDialog('This messaging device.','Compare this public identity fingerprint over a channel you trust. It is not a recovery secret.',`<div class="vh-note"><b>${esc(fingerprint.userId)}</b><p>Device ${esc(fingerprint.deviceId)}</p><p class="vh-fingerprint">${esc(fingerprint.ed25519)}</p></div><button class="vh-secondary" data-home="secure-verify">Verify another device</button>`);}
  async function secureDevices(userId){const current=guard(),messenger=state.secure;if(!messenger)return secureConnect();const ticket=showDialog('Verify messaging identities.','Signing in does not verify messaging devices. Compare a device fingerprint with its owner before marking it verified.',`<form class="vh-form" data-home-form="secure-device-search"><label class="vh-field">Exact messaging identity<input name="userId" value="${esc(typeof userId==='string'?userId:'')}" placeholder="@friend:example.org" required></label><button class="vh-secondary" type="submit">Find this identity’s devices</button></form><div id="home-secure-devices" role="status">Loading messaging devices…</div>${formError}`);try{const devices=await messenger.devices(typeof userId==='string'?userId:undefined);if(!current()||ticket!==state.dialogGeneration||messenger!==state.secure)return;const n=$('home-secure-devices');if(n)n.innerHTML=devices.map(d=>`<article class="vh-list-row"><div><b>${esc(d.userId)}</b><p>${esc(d.name||d.deviceId)}${d.current?' · this device':''}</p><small>${d.verified?'Verified':'Not verified'}</small></div>${d.verified?'':`<button class="vh-secondary" data-verify-user="${esc(d.userId)}" data-verify-device="${esc(d.deviceId)}">Compare</button>`}</article>`).join('')+'<button class="vh-secondary" data-home="secure-fingerprint">View this device fingerprint</button>';}catch(error){if(current()&&ticket===state.dialogGeneration)errorNode(error);}}

  async function verifySecureFingerprint(data){const current=guard(),messenger=state.secure;if(!messenger)throw Error('Connect your messaging device first.');await messenger.verifyFingerprint(data.userId,data.deviceId,data.fingerprint);if(current()&&messenger===state.secure){closeDialog();announce('Device fingerprint matched and was verified.');}}

    document.addEventListener('submit',event=>{if(!event.target.dataset.homeForm)return;event.preventDefault();submit(event.target);});
    document.addEventListener('input',event=>{if(event.target.id==='home-search')searchResults(event.target.value);if(event.target.id==='home-secure-input')captureSecureDraft();});
    document.addEventListener('keydown',event=>{if(event.target.id==='home-secure-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229){event.preventDefault();sendSecure();return;}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&state.account&&state.phase==='ready'){event.preventDefault();quickSearch();}});

    window.addEventListener('hashchange',()=>{if(state.phase==='ready')resume();});
    window.addEventListener('pageshow',event=>{if(event.persisted){lock();boot();}else checkSession();});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkSession();});
    setInterval(checkSession,30000);
    window.addEventListener('beforeunload',event=>{captureSecureDraft();if([...state.secureDrafts.values()].some(d=>d.text||d.pending)){event.preventDefault();event.returnValue='';}});
    window.addEventListener('pagehide',()=>{state.generation++;state.dialogGeneration++;});
    try{sessionEvents=new BroadcastChannel('voidline.account.session.v1');sessionEvents.onmessage=event=>{if(event.data?.type==='signed-out'&&event.data.accountId===state.account?.id){lock();state.phase='welcome';render();announce('Signed out in another tab. Account content is locked.');}};}catch(_){/* periodic validation still revokes local access */}
    const bridge={reload:boot,state,request,guard,showDialog,closeDialog,esc,icon,announce,render,registerExtension(module){if(extensions.includes(module))return;extensions.push(module);module.init?.(window.VoidHome);if(state.account)module.onAccount?.(state.account);render();}};window.VoidHome=Object.freeze(bridge);window.dispatchEvent?.(new Event('voidline:home-ready'));boot();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();

  document.addEventListener('click',event=>{const button=event.target.closest('[data-social-action]');if(!button||!currentAccount())return;event.preventDefault();Promise.resolve(act(button)).catch(reason=>error(reason.message));});
  document.addEventListener('submit',event=>{const form=event.target;if(form.dataset.socialForm!=='request'||!currentAccount())return;event.preventDefault();if(form.dataset.busy)return;form.dataset.busy='1';const button=form.querySelector('[type="submit"]'),username=String(new FormData(form).get('username')||'').trim().replace(/^@/,'');
   mutate('/api/social/request',{username},button,data=>{offset=0;if(data.request?.state==='accepted'){view='friends';return 'You are already friends.';}if(data.request?.direction==='incoming'){view='incoming';return 'This person already sent you a request. Review Incoming to accept it.';}view='outgoing';return data.alreadyExists?'Your request is already pending.':'Friend request sent.';}).finally(()=>{delete form.dataset.busy;});
  });
  document.addEventListener('change',event=>{if(event.target.id!=='social-allow-requests'||!currentAccount())return;const checkbox=event.target,prior=!checkbox.checked;mutate('/api/social/settings',{allowRequests:checkbox.checked},checkbox,'Request preference saved.').then(data=>{if(!data&&checkbox.isConnected)checkbox.checked=prior;});});
 }
 const extension={id:'social',init,navHTML,accountHTML,handles:action=>action==='friend'||action==='social-open',handleAction(action){if(action==='friend'||action==='social-open'){open('friends');return true;}return false;},onAccount(){sync();},onLock(){identity='';epoch++;panel++;snapshot=null;}};
 window.VoidSocial={open,extension};
 function register(){if(window.VoidHome?.registerExtension)window.VoidHome.registerExtension(extension);}
 window.addEventListener('voidline:home-ready',register,{once:true});register();
})();

</script>
