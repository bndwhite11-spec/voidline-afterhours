<style data-source="home.css">
/* VOIDLINE / a quiet, account-owned starting point. No sample state. */
:root {
  color-scheme: dark;
  --vh-bg: #15171c;
  --vh-rail: #0b0d11;
  --vh-side: #101217;
  --vh-surface: #1c1f26;
  --vh-raised: #22252e;
  --vh-line: #30333e;
  --vh-line-soft: #252831;
  --vh-text: #eceaf2;
  --vh-copy: #c6c4d1;
  --vh-muted: #a29eaf;
  --vh-accent: #cab9e8;
  --vh-accent-ink: #221a30;
  --vh-danger: #f1a7b5;
  --vh-success: #abd4c2;
  --vh-radius: 12px;
  --vh-message-size: 15px;
  --vh-topbar-height: 64px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  font-weight: 400;
  text-rendering: optimizeLegibility;
  background: var(--vh-bg);
  color: var(--vh-text);
}
* { box-sizing: border-box; }
html, body { width: 100%; min-width: 0; min-height: 100%; margin: 0; }
body { background: var(--vh-bg); font-size: 14px; line-height: 1.55; }
button, input, textarea, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--vh-accent); text-underline-offset: 4px; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--vh-accent); outline-offset: 4px; }
input, textarea, select { accent-color: var(--vh-accent); }
img, svg { max-width: 100%; }
button svg, a svg { width: 20px; height: 20px; flex-shrink: 0; }
[hidden] { display: none !important; }
::selection { background: #8d73b970; color: #fff; }
.vh-sr-only, .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.vh-app { width: 100%; min-height: 100dvh; overflow: clip; }
.vh-skip-link { position: fixed; z-index: 100; top: 8px; left: 12px; padding: 10px 18px; color: var(--vh-accent-ink); background: var(--vh-accent); border-radius: 8px; transform: translateY(-160%); }
.vh-skip-link:focus { transform: none; }
.vh-topbar { min-height: var(--vh-topbar-height); display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px 24px; border-bottom: 1px solid var(--vh-line-soft); background: #101216; }
.vh-wordmark { display: inline-flex; align-items: center; gap: 12px; min-width: 0; padding: 0; color: var(--vh-text); background: transparent; border: 0; text-decoration: none; }
.vh-wordmark img { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; }
.vh-wordmark b, .vh-wordmark strong { font-size: 17px; font-weight: 750; letter-spacing: .085em; }
.vh-wordmark span { color: var(--vh-muted); font-size: 11px; letter-spacing: .14em; }
.vh-wordmark>span:last-child { border-left: 1px solid #54505c; padding-left: 14px; }
.vh-topbar-actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
.vh-topbar-actions>a, .vh-topbar-actions>button { white-space: nowrap; }
.vh-eyebrow { display: block; font-size: 11px; line-height: 1.6; font-weight: 600; letter-spacing: .15em; color: #b9a9cf; text-transform: uppercase; }
.vh-primary, .vh-secondary, .vh-danger, .vh-icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; border: 1px solid transparent; border-radius: 9px; padding: 10px 17px; font-size: 14px; font-weight: 550; line-height: 1.45; text-decoration: none; transition: background-color .14s ease, border-color .14s ease, color .14s ease; }
.vh-primary { color: var(--vh-accent-ink); border-color: #e4d7f6; background: var(--vh-accent); box-shadow: 0 2px 9px #0003, inset 0 1px #f4eaff70; }
.vh-primary:hover { background: #e0cff6; border-color: #f5eaff; }
.vh-secondary { color: #d4c9e4; background: #aaa0c00b; border-color: #585063; }
.vh-secondary:hover { background: #b4a1cf19; border-color: #9c8cab; color: #f2e9ff; }
.vh-danger { color: var(--vh-danger); border-color: #97566780; background: #b3607714; }
.vh-danger:hover { color: #ffcfdb; background: #c56b8526; border-color: #c97891; }
.vh-icon-button { width: 44px; padding: 10px; background: transparent; color: var(--vh-muted); }
.vh-icon-button:hover { color: var(--vh-text); background: #cab9e810; }
.vh-primary:disabled, .vh-secondary:disabled, .vh-danger:disabled { color: #b6adbf; border-color: #585160; background: #7e718d22; box-shadow: none; }
.vh-primary[aria-busy="true"], .vh-secondary[aria-busy="true"] { cursor: progress; }
.vh-primary .vh-google-icon { height: 20px; width: 20px; }
.vh-text-button { border: 0; padding: 8px 0; min-height: 44px; background: transparent; color: var(--vh-accent); text-align: left; }
.vh-text-button:hover { text-decoration: underline; text-underline-offset: 4px; }
.vh-welcome { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); align-items: center; min-height: calc(100dvh - var(--vh-topbar-height)); max-width: 1450px; margin: 0 auto; padding: clamp(45px, 8vw, 120px) clamp(30px, 7vw, 110px); gap: clamp(36px, 5vw, 90px); background: radial-gradient(ellipse at 81% 41%, #9c82c20a, transparent 58%); }
.vh-welcome-copy { position: relative; z-index: 1; max-width: 625px; min-width: 0; }
.vh-welcome h1 { font-size: clamp(38px, 5.2vw, 74px); line-height: 1.07; font-weight: 460; letter-spacing: -.065em; margin: 27px 0 25px; color: #f1edf7; text-wrap: balance; }
.vh-welcome h1 em { color: #c7b8d8; font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: -.06em; }
.vh-welcome-copy>p { max-width: 430px; color: var(--vh-copy); font-size: 16px; line-height: 1.85; margin: 0 0 28px; }
.vh-welcome-copy>.vh-primary { min-width: 245px; }
.vh-welcome-copy>.vh-note { margin-top: 18px; max-width: 430px; }
.vh-welcome-footer { display: flex; gap: 12px 24px; flex-wrap: wrap; padding-top: 28px; margin-top: 38px; border-top: 1px solid var(--vh-line); color: var(--vh-muted); font-size: 12px; }
.vh-orbit { position: relative; aspect-ratio: 1; width: min(100%, 440px); justify-self: center; display: grid; place-items: center; isolation: isolate; }
.vh-orbit:before, .vh-orbit:after { content: ""; position: absolute; border: 1px solid #afa1bf36; border-radius: 50%; inset: 5%; transform: rotate(-30deg) scaleX(.58); box-shadow: inset 1px 1px #fff1, 0 0 50px #b7a0cb06; }
.vh-orbit:after { transform: rotate(35deg) scaleX(.58); inset: 1%; border-color: #c1b3d024; }
.vh-orbit img { position: relative; width: 49%; border-radius: 22%; filter: drop-shadow(0 25px 22px #0007); z-index: 1; }
.vh-orbit>span { position: absolute; bottom: 2%; font-size: 11px; letter-spacing: .18em; color: #a69ab3; }
.vh-orbit>i { position: absolute; height: 1px; width: 100%; top: 50%; left: 0; background: linear-gradient(90deg, transparent, #bca6ce33, transparent); transform: rotate(-17deg); }
.vh-note, .vh-session-status { color: var(--vh-muted); font-size: 13px; line-height: 1.75; }
.vh-note a { color: var(--vh-accent); }
.vh-session-status { display: flex; align-items: center; gap: 9px; }
.vh-session-status:before { content: ""; height: 6px; width: 6px; background: #c0abc9; border-radius: 50%; flex-shrink: 0; }
.vh-error { color: #f1b2c2; font-size: 13px; line-height: 1.7; padding: 12px 14px; background: #8b42501c; border: 1px solid #96526770; border-radius: 8px; overflow-wrap: anywhere; }
.vh-error:empty { display: none; }
.vh-loading { display: grid; min-height: 100dvh; padding: 30px; place-content: center; text-align: center; color: var(--vh-muted); }
.vh-loading img { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px; }
.vh-layout { display: grid; height: calc(100dvh - var(--vh-topbar-height)); min-height: 0; grid-template-columns: 72px 252px minmax(0, 1fr); }
.vh-layout.has-details { grid-template-columns: 72px 252px minmax(0, 1fr) 260px; }
.vh-rail { min-width: 0; overflow-y: auto; scrollbar-width: thin; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--vh-rail); border-right: 1px solid var(--vh-line-soft); }
.vh-rail button, .vh-rail a { position: relative; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; min-height: 48px; padding: 8px; border: 1px solid #77718435; background: #9a90aa0b; color: #b4a9c0; border-radius: 14px; flex-shrink: 0; text-decoration: none; font-size: 14px; font-weight: 600; overflow: visible; }
.vh-rail button:hover, .vh-rail a:hover { background: #cab9e81c; color: var(--vh-text); border-color: #a791bc70; }
.vh-rail .is-active, .vh-rail [aria-current="page"] { color: #efe7fb; background: #b49bc02a; border-color: #b8a3cf8c; border-radius: 16px; }
.vh-rail .is-active:before, .vh-rail [aria-current="page"]:before { content: ""; position: absolute; left: -11px; width: 3px; height: 22px; background: var(--vh-accent); border-radius: 0 3px 3px 0; }
.vh-rail hr { width: 28px; border: 0; border-top: 1px solid var(--vh-line); margin: 4px 0; }
.vh-rail-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 18px; }
.vh-sidebar { background: var(--vh-side); border-right: 1px solid var(--vh-line); min-width: 0; overflow-y: auto; scrollbar-width: thin; padding: 20px 14px; }
.vh-sidebar h2 { margin: 0 6px 18px; font-size: 17px; line-height: 1.4; font-weight: 600; letter-spacing: -.02em; overflow-wrap: anywhere; }
.vh-sidebar .vh-eyebrow { margin: 0 6px 7px; font-size: 10px; }
.vh-sidebar>p { margin: 12px 7px; color: var(--vh-muted); font-size: 13px; line-height: 1.8; }
.vh-sidebar>.vh-primary, .vh-sidebar>.vh-secondary { width: 100%; margin: 4px 0; }
.vh-sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 13px; margin-bottom: 10px; border-bottom: 1px solid var(--vh-line); }
.vh-sidebar-head h2 { margin: 0 6px; }
.vh-sidebar-footer { margin-top: 24px; padding: 20px 6px 0; border-top: 1px solid var(--vh-line); }
.vh-sidebar-footer .vh-note { font-size: 12px; }
.vh-nav-list { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.vh-nav-item { display: flex; align-items: center; width: 100%; min-height: 44px; padding: 10px 12px; gap: 10px; text-align: left; border: 1px solid transparent; border-radius: 8px; color: var(--vh-muted); background: transparent; text-decoration: none; font-size: 14px; line-height: 1.45; }
.vh-nav-item>span:not(.vh-avatar) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.vh-nav-item svg, .vh-nav-item img { width: 20px; height: 20px; flex-shrink: 0; }
.vh-nav-item:hover { color: #f0e7fa; background: #b5a0c511; }
.vh-nav-item.is-active, .vh-nav-item[aria-current="page"] { color: #eadcf8; border-color: #b5a0c52d; background: linear-gradient(90deg, #aa8cca27, #aa8cca10); }
.vh-nav-item small { margin-left: auto; font-size: 12px; color: #b9abc7; }
.vh-main { min-width: 0; min-height: 0; overflow-y: auto; position: relative; background: var(--vh-bg); scrollbar-gutter: stable; }
.vh-main:focus { outline: none; }
.vh-page-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 82px; padding: 18px 30px; border-bottom: 1px solid var(--vh-line); background: #15171cee; }
.vh-page-header h1 { font-size: 19px; font-weight: 600; letter-spacing: -.025em; line-height: 1.4; margin: 0; overflow-wrap: anywhere; }
.vh-page-header p, .vh-page-header .vh-eyebrow { margin: 4px 0 0; color: var(--vh-muted); font-size: 12px; letter-spacing: 0; text-transform: none; }
.vh-page-header>div { min-width: 0; }
.vh-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.vh-empty { min-height: calc(100% - 82px); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; max-width: 760px; padding: clamp(28px, 5vw, 80px); margin: 0 auto; }
.vh-empty-mark { width: 64px; height: 64px; margin: 0 0 27px; color: #c1b0d3; background: radial-gradient(ellipse at 20% 0%, #bba5d21f, transparent), #1e1e27; border: 1px solid #9885b14a; border-radius: 18px; display: grid; place-items: center; box-shadow: inset 0 1px #e9d8ff10; }
.vh-empty-mark img { width: 44px; height: 44px; border-radius: 12px; }
.vh-empty-mark svg { width: 27px; height: 27px; }
.vh-empty h1, .vh-empty h2 { margin: 0 0 17px; color: #ece7f3; font-size: clamp(28px, 3vw, 44px); font-weight: 450; line-height: 1.16; letter-spacing: -.045em; max-width: 540px; text-wrap: balance; }
.vh-empty p { max-width: 450px; margin: 0 0 24px; color: var(--vh-copy); font-size: 15px; line-height: 1.85; }
.vh-empty .vh-note { margin-top: 24px; font-size: 12px; color: var(--vh-muted); }
.vh-empty-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.vh-details { min-width: 0; background: #121419; border-left: 1px solid var(--vh-line); overflow-y: auto; padding: 24px 20px; }
.vh-details h2 { font-size: 12px; color: var(--vh-muted); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 20px; }
.vh-details p { color: var(--vh-muted); font-size: 12px; line-height: 1.8; }
.vh-member { display: flex; gap: 11px; align-items: center; min-height: 56px; padding: 8px 0; }
.vh-member b { display: block; font-size: 13px; color: var(--vh-copy); overflow-wrap: anywhere; }
.vh-member small { color: var(--vh-muted); font-size: 12px; }
.vh-avatar { display: inline-flex; justify-content: center; align-items: center; width: 42px; height: 42px; flex-shrink: 0; border: 1px solid #a18cb53d; border-radius: 14px; background: linear-gradient(140deg, #3b3049, #282631); color: #d3c0e8; font-size: 15px; font-weight: 600; }
.vh-avatar svg { width: 22px; height: 22px; }
.vh-list-row { display: flex; align-items: center; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--vh-line); min-width: 0; }
.vh-list-row>div { min-width: 0; flex: 1; }
.vh-list-row b, .vh-list-row h3 { display: block; font-size: 14px; color: var(--vh-text); font-weight: 550; line-height: 1.5; margin: 0 0 5px; overflow-wrap: anywhere; }
.vh-list-row p, .vh-list-row small { font-size: 12px; color: var(--vh-muted); margin: 0; line-height: 1.8; overflow-wrap: anywhere; }
.vh-list-row>.vh-secondary, .vh-list-row>.vh-danger { flex-shrink: 0; }
.vh-content { padding: 26px 30px; max-width: 930px; margin: 0 auto; }
.vh-content h2 { font-weight: 550; font-size: 20px; margin: 0 0 16px; letter-spacing: -.025em; }
.vh-content h3 { font-size: 15px; font-weight: 550; margin: 25px 0 12px; }

/* Durable local operation journal. A successful mutation is one atomic setItem;

    value.notifications = objects(value.notifications);
    for (const field of ['friends','deleted','artifactInspected']) value[field] = Object.fromEntries((value[field] || []).map(id => [id, true]));
    return value;
  }
  function decode(encoded) {
    const value = copy(encoded);
    value.messages = Object.fromEntries(Object.entries(value.messages || {}).map(([key, records]) => [key, Object.values(records).filter(m => m && m.id).sort((a,b) => a.time-b.time || a.id.localeCompare(b.id))]));

    value.customServers.forEach(server => {server.channels = Object.entries(server.channels || {}).sort((a,b) => (a[1].order||0)-(b[1].order||0)||a[0].localeCompare(b[0])).map(([id, c]) => [id, c.description || '']);});

    value.notifications = Object.values(value.notifications || {}).sort((a,b) => a.time-b.time);
    for(const field of ['friends','deleted','artifactInspected'])value[field] = Object.keys(value[field] || {}).filter(id => value[field][id]);

    if(hash&&known.has(context+'\n'+message.id+'\n'+message.author+'\n'+hash))return {kind:'known-fixture',reason:'Exact unchanged message from a shipped sample catalogue.'};
    return {kind:'uncertain',reason:hash?'Provenance is not an exact shipped fixture match; retained.':'Content fingerprints are unavailable in this browser; retained.'};
  }
  async function extract(state,options={}) {
    if(!object(state))throw new Error('The legacy archive is not a record. Export its raw recovery copy instead.');

      }
      candidate.messages[context]=retained;
    }

    for(const key of referenced)if(excludedSources.has(key))referenceSources.push(excludedSources.get(key));

  }
  function snapshot(storage) {

  }
  function draftSummary(storage) {
    if(!storage)return {available:false,drafts:0,threadDrafts:0,attachmentRecords:0};

      const raw=JSON.parse(storage.getItem(TAB)||'{}');

  async function inspect(storage,options={}) {

    }
  }
  async function exportArchive(storage,options={}) {
    // Only designated legacy keys are exported: never authentication/session
    // cookies, another application's storage, or account transport caches.
    const localRecords=records(storage,archiveKey),sessionRecords=options.includeSessionDrafts?records(options.sessionStorage,draftKey):{};

  }
  async function downloadArchive(storage,options={}) {

  }

  function time(value) {const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'Time unavailable';}
  function closeDialog(restore=true){if(recoveryAcknowledgement){const resolve=recoveryAcknowledgement;recoveryAcknowledgement=null;resolve(false);}state.dialogGeneration++;if(dialog?.open)dialog.close();if(restore&&priorFocus?.isConnected)priorFocus.focus();priorFocus=null;}

  async function openCommunity(id,preferred=null){if(!state.communities.some(c=>c.id===id))return;state.generation++;const current=guard();state.view='servers';state.secureRoomId=null;state.secureMessages=[];state.communityId=id;state.channelId=null;state.messages=[];state.members=[];state.channels=[];state.error='';render();try{const data=await request(`/api/live/communities/${encodeURIComponent(id)}/channels`);if(!current())return;state.channels=data.channels||[];render();remember();if(preferred&&state.channels.some(c=>c.id===preferred))await openChannel(preferred);}catch(error){if(current()){state.error=error.message;announce(error.message);}}}
  async function openChannel(id){if(!state.channels.some(c=>c.id===id))return;const old=$('home-feed');if(old&&state.channelId)state.readPositions.set(state.channelId,old.scrollTop);state.generation++;const current=guard();state.channelId=id;state.view='servers';state.messages=[];state.error='';state.loading=true;state.older=false;render();remember();history.replaceState(null,'',location.pathname+location.search+'#servers/'+encodeURIComponent(state.communityId)+'/channels/'+encodeURIComponent(id));try{const data=await request(`/api/live/channels/${encodeURIComponent(id)}/messages?limit=50`);if(!current())return;state.messages=data.messages||[];state.older=!!data.page?.hasMore;}catch(error){if(current())state.error=error.message;}finally{if(current()){state.loading=false;render();const feed=$('home-feed');if(feed)feed.scrollTop=state.readPositions.get(id)??feed.scrollHeight;}}}
  async function olderMessages(button){if(!state.channelId||!state.messages.length||!state.older)return;const current=guard(),id=state.channelId,feed=$('home-feed'),top=feed?.scrollTop||0,height=feed?.scrollHeight||0;if(button)button.disabled=true;try{const data=await request(`/api/live/channels/${encodeURIComponent(id)}/messages?before=${state.messages[0].seq}&limit=50`);if(!current())return;const all=new Map([...data.messages,...state.messages].map(m=>[m.id,m]));state.messages=[...all.values()].sort((a,b)=>a.seq-b.seq);state.older=!!data.page?.hasMore;render();const next=$('home-feed');if(next)next.scrollTop=top+next.scrollHeight-height;}catch(error){if(current())announce(error.message);}finally{if(button?.isConnected)button.disabled=false;}}
  function view(name){state.generation++;state.view=name;state.secureRoomId=null;state.secureMessages=[];state.channelId=null;state.communityId=null;state.channels=[];state.messages=[];state.members=[];state.error='';closeDialog(false);render();remember();history.replaceState(null,'',location.pathname+location.search+'#'+name);$('home-main')?.focus();}
  async function security(){const current=guard();const ticket=showDialog('Devices & security.','Account sessions and encryption devices have different purposes.',`<div id="home-security" role="status">Loading your sessions…</div>${formError}`);try{const data=await request('/api/auth/devices');if(!current()||ticket!==state.dialogGeneration)return;const target=$('home-security');if(!target)return;target.innerHTML=`<div class="vh-note"><b>${secureReady()?'Encrypted messaging connected':'Encrypted messaging not connected'}</b><p>${secureReady()?'Messaging identity: '+esc(state.secureStatus.userId)+' / '+esc(state.secureStatus.deviceId):'No verified messaging keys are enrolled through this account session.'}</p><p>Google login sessions below are separate from Matrix messaging devices. Revoking a Google session locks this app; it does not revoke a Matrix token used by another client.</p></div><div class="vh-dialog-actions">${secureReady()?'<button class="vh-secondary" data-home="secure-verify">Verify devices</button><button class="vh-secondary" data-home="secure-fingerprint">This device fingerprint</button><button class="vh-secondary" data-home="secure-recovery">Set up recovery</button><button class="vh-secondary" data-home="secure-restore">Restore backup</button><button class="vh-danger" data-home="secure-disconnect-confirm">Disconnect messaging</button>':'<button class="vh-primary" data-home="secure-connect">Connect encrypted messaging</button>'}</div><h3>Google login sessions</h3><div class="vh-result-list">${(data.devices||[]).map(d=>`<article class="vh-list-row"><div><b>${esc(d.deviceName||'Browser session')}${d.current?' · this session':''}</b><p>Last active ${esc(time(d.lastActiveAt))}</p><small>Signed in ${esc(time(d.createdAt))}</small></div><button class="vh-danger" data-home-revoke="${esc(d.id)}">${d.current?'Sign out':'Revoke session'}</button></article>`).join('')}</div><a class="vh-secondary" href="${esc(signInURL(true))}" target="_top">Reauthenticate with Google</a>`;}catch(error){if(current()&&ticket===state.dialogGeneration)errorNode(error);}}
  function profileDialog(){const p=state.account;showDialog('Your public profile.','Only the information you choose is visible to other server members.',`<form class="vh-form" data-home-form="profile"><label class="vh-field">Username<input value="${esc(p.username)}" readonly></label><label class="vh-field">Display name<input name="displayName" value="${esc(p.displayName)}" minlength="2" maxlength="32" required></label><label class="vh-field">Bio<textarea name="bio" rows="3" maxlength="240">${esc(p.bio||'')}</textarea></label><label class="vh-field">Status<input name="status" value="${esc(p.status||'')}" maxlength="80"></label><div class="vh-form-grid"><label class="vh-field">Theme<select name="theme">${['obsidian','lilac','ice'].map(v=>`<option ${p.theme===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="vh-field">Avatar mark<select name="avatar">${['moon','orbit','spark','leaf','ghost'].map(v=>`<option ${p.avatar===v?'selected':''}>${v}</option>`).join('')}</select></label></div>${formError}<p class="vh-note">No artifacts are granted for choosing a profile. Cosmetics do not confer staff roles.</p><button class="vh-primary" type="submit">Save profile</button></form>`);}
  function appearance(){const p=preferences();showDialog('Make yourself comfortable.','These reading preferences are saved for this account on this device.',`<form class="vh-form" data-home-form="appearance"><label class="vh-field">Text size<select name="font"><option value="15" ${p.font==='15'?'selected':''}>Comfortable · 15px</option><option value="17" ${p.font==='17'?'selected':''}>Large · 17px</option><option value="19" ${p.font==='19'?'selected':''}>Extra large · 19px</option></select></label><label class="vh-check"><input type="checkbox" name="highContrast" ${p.highContrast?'checked':''}>High contrast</label><label class="vh-check"><input type="checkbox" name="reducedMotion" ${p.reducedMotion?'checked':''}>Reduce motion</label>${formError}<button class="vh-primary" type="submit">Save preferences</button></form>`);}

  function dataDialog(){showDialog('Your data, deliberately.','Previous device-local archives are never uploaded into your account automatically.',`<div class="vh-note"><b>Previous local archive</b><p>Export the untouched records from this browser for review. Existing fixtures and genuine contributions remain in the original archive; this action does not turn samples into account conversations.</p><button class="vh-secondary" data-home="review-local">Review previous archive</button><button class="vh-secondary" data-home="export-local">Export previous local archive</button></div><p>Shared account data and previous unencrypted server history are preserved. Full account export and deletion are not available in this release.</p><a class="vh-secondary" href="downloads/voidline-source.zip" download>Download source</a>`);}
  function exportLocal(){try{const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key==='voidline.local.v1'||key==='voidline.archive.v3.base'||key?.startsWith('voidline.archive.v3.op.'))keys.push(key);}if(!keys.length)return announce('No previous local archive was found in this browser.');const records=Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]));const data=JSON.stringify({format:'voidline-untouched-browser-records',version:1,records},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='voidline-previous-local-archive.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);announce('Previous local records exported. Nothing was imported or uploaded.');}catch(_){announce('This browser could not read its previous archive. No records were changed.');}}
  async function saved(){const current=guard();const ticket=showDialog('Saved Messages.','A personal utility outside your conversation list.',`<div id="home-saved" role="status">Loading Saved…</div>${formError}`);try{const data=await request('/api/live/saved?limit=30&offset=0');if(!current()||ticket!==state.dialogGeneration)return;const n=$('home-saved');if(n)n.innerHTML=data.total?`<p class="vh-note">These ${Number(data.total)} saved records predate encrypted messaging.</p>`+(data.messages||[]).map(m=>`<article class="vh-list-row"><div><b>${esc(m.author_name||'Unavailable original')}</b><p>${m.unavailable?'The original is unavailable.':esc(m.text||'Deleted message')}</p></div></article>`).join(''):'<div class="vh-history-empty"><h3>Nothing saved yet.</h3><p>Your account starts with an empty personal space.</p></div>';}catch(error){if(current()&&ticket===state.dialogGeneration)errorNode(error);}}

  function searchResults(query){const term=query.toLocaleLowerCase().trim(),n=$('home-search-results');if(!n)return;const communities=state.communities.filter(c=>c.name.toLocaleLowerCase().includes(term)),channels=state.channels.filter(c=>c.name.toLocaleLowerCase().includes(term));n.innerHTML=communities.map(c=>`<button class="vh-nav-item" data-home-community="${esc(c.id)}">${icon('servers')}<span>${esc(c.name)}</span></button>`).join('')+channels.map(c=>`<button class="vh-nav-item" data-home-channel="${esc(c.id)}"><span>#</span><span>${esc(c.name)} <small>${esc(community()?.name)}</small></span></button>`).join('')+(!communities.length&&!channels.length?'<p>No accessible locations match. Create a server or join with an invite to begin.</p>':'')+'<p class="vh-fineprint">Channel results cover your open server. Message search will run on your device when encrypted messaging is available.</p>';}
  async function logout(){const current=guard();try{await request('/api/auth/logout',{});if(!current())return;sessionEvents?.postMessage({type:'signed-out',accountId:state.account.id});await disconnectSecure(false);if(!current())return;lock();state.phase='welcome';render();history.replaceState(null,'',location.pathname);announce('Signed out. Account content is locked.');}catch(error){if(current())showDialog('Sign-out could not finish.','The server could not invalidate this session. Retry to sign out completely.',`<p class="vh-error">${esc(error.message)}</p><button class="vh-primary" data-home="logout">Retry sign out</button>`);}}

  async function submit(form){if(form.dataset.busy)return;form.dataset.busy='true';const submitButton=form.querySelector('[type="submit"]');if(submitButton)submitButton.disabled=true;const current=guard(),ticket=state.dialogGeneration;const data=Object.fromEntries(new FormData(form)),kind=form.dataset.homeForm;const node=form.querySelector('[data-form-error]');if(node)node.textContent='';try{
    if(kind==='secure-device-search'){if(!/^@[^:\s]+:[^\s]+$/.test(data.userId))throw Error('Enter an exact Matrix identity, such as @friend:example.org.');await secureDevices(data.userId);return;}

  let recoveryAcknowledgement=null;
  async function setupRecovery(){const messenger=state.secure,account=state.account?.id;if(!messenger)return secureConnect();try{const result=await messenger.setupRecovery({onRecoveryKey:encoded=>new Promise(resolve=>{if(state.secure!==messenger||state.account?.id!==account)return resolve(false);if(recoveryAcknowledgement)recoveryAcknowledgement(false);recoveryAcknowledgement=resolve;showDialog('Keep your recovery key.','Store this secret offline somewhere safe. Anyone with the necessary account access and this secret may restore backed-up message keys.',`<label class="vh-field">Recovery secret<textarea readonly spellcheck="false" rows="3">${esc(encoded)}</textarea></label><p class="vh-note">Losing every usable device and this recovery secret can make old history unrecoverable. Google sign-in cannot replace it.</p><button class="vh-primary" data-home-recovery="saved">I stored the recovery key safely</button><button class="vh-secondary" data-home-recovery="cancel">Cancel setup</button>`);})});if(state.secure===messenger&&state.account?.id===account){closeDialog();announce(result?.ready&&result?.crossSigningReady?'Encrypted recovery and cross-signing setup completed.':'Recovery setup is incomplete. Verify the messaging service status before relying on it.');}}catch(error){if(state.secure===messenger)errorNode(error);}}
  function restoreRecovery(){if(!state.secure)return secureConnect();showDialog('Restore message keys.','Your Google login does not contain these keys. Use only your own Matrix recovery secret.',`<form class="vh-form" data-home-form="secure-restore"><label class="vh-field">Recovery secret<textarea name="recoveryKey" required rows="3" autocomplete="off" spellcheck="false" autofocus></textarea></label>${formError}<button class="vh-primary" type="submit">Restore encrypted backup</button></form>`);}
  async function restoreSecureRecovery(data){const messenger=state.secure,account=state.account?.id;if(!messenger)throw Error('Connect messaging first.');await messenger.restoreRecovery(data.recoveryKey);if(state.secure===messenger&&state.account?.id===account){closeDialog();announce('Recovery keys restored by the messaging service.');await refreshSecureMessages();}}
  async function disconnectSecure(revokeSession=true){captureSecureDraft();const messenger=state.secure;if(!messenger)return;state.secure=null;state.secureStatus=null;state.secureRooms=[];state.secureRoomId=null;state.secureMessages=[];state.secureDrafts.clear();state.verification=null;if(recoveryAcknowledgement){recoveryAcknowledgement(false);recoveryAcknowledgement=null;}await messenger.disconnect({revokeSession});if(state.account){render();if(revokeSession)announce('Messaging session disconnected. Your Google session is separate.');}}
  async function checkSession(){if(!state.account||document.hidden)return false;const account=state.account.id,current=guard();try{const data=await request('/api/auth/session');if(!current())return false;if(data.account?.id!==account){lock();await boot();return false;}state.csrf=data.csrfToken;state.session=data.session;return true;}catch(_){return false;}}

  function init(){root=$('home-root');if(!root){root=document.createElement('div');root.id='home-root';document.body.appendChild(root);}root.className='vh-app';dialog=$('home-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='home-dialog';dialog.className='vh-dialog';document.body.appendChild(dialog);}const announcer=document.createElement('div');announcer.id='home-announcer';announcer.className='vh-sr-only';announcer.setAttribute('role','status');document.body.appendChild(announcer);const toast=document.createElement('div');toast.id='home-toast';toast.className='vh-toast';toast.hidden=true;toast.setAttribute('aria-hidden','true');document.body.appendChild(toast);
    document.addEventListener('click',event=>{const button=event.target.closest('button,a');if(!button)return;if(button.dataset.home){event.preventDefault();Promise.resolve(action(button.dataset.home,button)).catch(error=>announce(error.message));}else if(button.dataset.homeRoom){event.preventDefault();closeDialog();openSecureRoom(button.dataset.homeRoom);}else if(button.dataset.homeCommunity){event.preventDefault();closeDialog();openCommunity(button.dataset.homeCommunity);}else if(button.dataset.homeChannel){event.preventDefault();closeDialog();openChannel(button.dataset.homeChannel);}else if(button.dataset.verifyUser){event.preventDefault();compareDevice(button.dataset.verifyUser,button.dataset.verifyDevice);}else if(button.dataset.homeVerification){event.preventDefault();verificationAction(button.dataset.homeVerification);}else if(button.dataset.homeRecovery){event.preventDefault();const resolve=recoveryAcknowledgement;recoveryAcknowledgement=null;resolve?.(button.dataset.homeRecovery==='saved');closeDialog();}else if(button.dataset.homeRevoke){event.preventDefault();revoke(button.dataset.homeRevoke);}});
    document.addEventListener('submit',event=>{if(!event.target.dataset.homeForm)return;event.preventDefault();submit(event.target);});
    document.addEventListener('input',event=>{if(event.target.id==='home-search')searchResults(event.target.value);if(event.target.id==='home-secure-input')captureSecureDraft();});
    document.addEventListener('keydown',event=>{if(event.target.id==='home-secure-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229){event.preventDefault();sendSecure();return;}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&state.account&&state.phase==='ready'){event.preventDefault();quickSearch();}});
    dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
    window.addEventListener('hashchange',()=>{if(state.phase==='ready')resume();});
    window.addEventListener('pageshow',event=>{if(event.persisted){lock();boot();}else checkSession();});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkSession();});
    setInterval(checkSession,30000);
    window.addEventListener('beforeunload',event=>{captureSecureDraft();if([...state.secureDrafts.values()].some(d=>d.text||d.pending)){event.preventDefault();event.returnValue='';}});
    window.addEventListener('pagehide',()=>{state.generation++;state.dialogGeneration++;});
    try{sessionEvents=new BroadcastChannel('voidline.account.session.v1');sessionEvents.onmessage=event=>{if(event.data?.type==='signed-out'&&event.data.accountId===state.account?.id){lock();state.phase='welcome';render();announce('Signed out in another tab. Account content is locked.');}};}catch(_){/* periodic validation still revokes local access */}
    window.VoidHome=Object.freeze({reload:boot});boot();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

</script>
</body>
