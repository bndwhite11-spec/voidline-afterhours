/* First-entry chrome reveal. All motion stops within the entry deadline. */
.ve-entry { position:fixed; z-index:900; inset:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-width:0; padding:28px clamp(20px,5vw,76px); overflow:auto; overscroll-behavior:contain; background:var(--vh-bg,#0E1013); color:var(--vh-text,#F1F0EC); opacity:1; transition:opacity 140ms ease-out; isolation:isolate; }
.ve-entry::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background:transparent; }
.ve-is-leaving { opacity:0; pointer-events:none; }
.ve-header,.ve-footer { display:flex; align-items:center; justify-content:space-between; gap:16px; min-width:0; }
.ve-signature { display:grid; gap:1px; font-size:calc(0.8125rem * var(--vl-text-scale,1)); letter-spacing:.12em; font-weight:650; }
.ve-signature>span { color:var(--vh-muted,#A5ABB4); font-size:calc(0.75rem * var(--vl-text-scale,1)); letter-spacing:.19em; font-weight:450; }
.ve-skip { min-height:44px; padding:9px 12px; border:1px solid var(--vh-line,#2B313A); border-radius:4px; color:var(--vh-copy,#D3D6D2); background:var(--vh-side,#15181D); font-size:calc(0.75rem * var(--vl-text-scale,1)); line-height:1.4; }
.ve-skip>span { margin-left:16px; font-size:calc(1rem * var(--vl-text-scale,1)); }
.ve-skip:hover { color:var(--vh-text,#F1F0EC); border-color:var(--vh-accent,#CBEF84); background:var(--vh-surface,#1D2229); }
.ve-skip:focus-visible { outline:2px solid var(--vh-accent,#CBEF84); outline-offset:4px; }
.ve-center { display:grid; align-content:center; justify-items:center; padding:32px 0 48px; gap:24px; min-width:0; }
.ve-art { position:relative; width:clamp(132px,18vw,210px); aspect-ratio:1; display:grid; place-items:center; }
.ve-art>svg { width:100%; height:100%; overflow:visible; }
.ve-axis { position:absolute; display:block; background:var(--vh-line,#2B313A); opacity:.55; }
.ve-axis-x { width:115%; height:1px; top:100%; }
.ve-axis-y { height:130%; width:1px; }
.ve-metal { fill:url(#ve-chrome); opacity:1; }
.ve-plane-left { animation:ve-left-in 380ms 60ms cubic-bezier(.2,.7,.2,1) both; }
.ve-plane-right { animation:ve-right-in 400ms 130ms cubic-bezier(.2,.7,.2,1) both; }
.ve-plane-core { animation:ve-core-in 320ms 230ms cubic-bezier(.2,.7,.2,1) both; }
.ve-outline { fill:none; stroke:#edf0eb; stroke-width:.7; opacity:.7; }
.ve-outline>path { animation:ve-edge-in 400ms 300ms ease-out both; }
.ve-glint { animation:ve-glint 550ms 230ms ease-in-out both; }
.ve-title { width:100%; min-width:0; text-align:center; }
.ve-eyebrow { margin:0 0 12px; color:var(--vh-muted,#A5ABB4); font-size:calc(0.75rem * var(--vl-text-scale,1)); letter-spacing:.04em; }
.ve-wordmark { margin:0; padding-left:.14em; color:var(--vh-text,#F1F0EC); font-size:calc(clamp(2rem,5vw,3.875rem) * var(--vl-text-scale,1)); line-height:1.15; letter-spacing:.14em; font-weight:560; }
.ve-rule { display:block; width:36px; height:1px; background:var(--vh-accent,#CBEF84); margin:22px auto 15px; transform-origin:left; animation:ve-rule-in 520ms 160ms ease-out both; }
.ve-status { min-height:20px; margin:0; color:var(--vh-muted,#A5ABB4); font-size:calc(0.75rem * var(--vl-text-scale,1)); line-height:1.5; }
.ve-footer { padding-top:12px; border-top:1px solid var(--vh-line-soft,#242A32); color:var(--vh-muted,#A5ABB4); font-family:inherit; font-size:calc(0.75rem * var(--vl-text-scale,1)); line-height:1.6; letter-spacing:.12em; }
@keyframes ve-left-in { from { opacity:0;transform:translate(-12px,6px); } to { opacity:1;transform:translate(0,0); } }
@keyframes ve-right-in { from { opacity:0;transform:translate(12px,-6px); } to { opacity:1;transform:translate(0,0); } }
@keyframes ve-core-in { from { opacity:0;transform:translateY(10px); } to { opacity:1;transform:translateY(0); } }
@keyframes ve-glint { from { transform:translateX(0) skewX(-15deg); } to { transform:translateX(420px) skewX(-15deg); } }
@keyframes ve-edge-in { from { opacity:0; } to { opacity:1; } }
@keyframes ve-rule-in { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@media (max-width:380px) { .ve-entry { padding:16px 20px; } .ve-center { gap:20px; padding:26px 0; } .ve-art { width:108px; } .ve-footer { letter-spacing:.04em; font-size:calc(0.75rem * var(--vl-text-scale,1)); gap:8px; } .ve-wordmark { font-size:calc(2rem * var(--vl-text-scale,1)); letter-spacing:.1em; padding-left:.1em; } }
@media (max-height:500px) and (min-width:560px) { .ve-entry { padding-top:14px; padding-bottom:14px; } .ve-center { grid-template-columns:auto auto; gap:40px; justify-content:center; align-items:center; padding:20px 0; } .ve-art { width:108px; } .ve-title { text-align:left; } .ve-wordmark { font-size:calc(2.5rem * var(--vl-text-scale,1)); padding-left:0; } .ve-rule { margin-left:0; } }
@media (prefers-reduced-motion:reduce) { .ve-entry,.ve-metal,.ve-plane,.ve-outline>path,.ve-rule,.ve-glint { animation:none; transition:none; } .ve-glint { display:none; } .ve-metal { opacity:1; } .ve-outline>path { stroke-dashoffset:0; } }
@media (forced-colors:active) { .ve-entry { background:Canvas; color:CanvasText; } .ve-metal { fill:CanvasText; } .ve-skip { border-color:ButtonText; color:ButtonText; background:ButtonFace; } .ve-outline { stroke:Highlight; } .ve-wordmark,.ve-signature,.ve-signature>span,.ve-eyebrow,.ve-status,.ve-footer { color:CanvasText; } }

html.vh-reduced-motion .ve-entry,html.vh-reduced-motion .ve-metal,html.vh-reduced-motion .ve-plane,html.vh-reduced-motion .ve-outline>path,html.vh-reduced-motion .ve-rule { animation:none!important;transition:none!important; }
html.vh-reduced-motion .ve-metal { opacity:1; }
html.vh-reduced-motion .ve-outline>path { stroke-dashoffset:0; }

html.vh-reduced-motion .ve-glint { display:none;animation:none!important; }

<style data-source="home.css">
/* VOIDLINE — account forms and messenger. One shared scale, no fixture styles. */
:root {
  color-scheme: dark;
  /* One semantic palette. Artwork may use its own material colors. */
  --vh-bg: #0E1013;
  --vh-rail: #111418;
  --vh-side: #15181D;
  --vh-surface: #1D2229;
  --vh-raised: #252C34;
  --vh-line: #2B313A;
  --vh-line-soft: #242A32;
  --vh-control-line: #7B8592;
  --vh-text: #F1F0EC;
  --vh-copy: #D3D6D2;
  --vh-muted: #A5ABB4;
  --vh-accent: #CBEF84;
  --vh-accent-hover: #DDF5AF;
  --vh-accent-ink: #17200E;
  --vh-selected: #293226;
  --vh-own-message: #242F27;
  --vh-danger: #E8A8A7;
  --vh-danger-surface: #342326;
  --vh-success: #B7D7BA;
  --vh-radius: 6px;
  --vh-radius-panel: 10px;
  --vh-space-1: 4px;
  --vh-space-2: 8px;
  --vh-space-3: 12px;
  --vh-space-4: 16px;
  --vh-space-5: 24px;
  --vh-shadow-panel: 0 16px 48px #0006;
  --vh-motion-control: 120ms;
  --vh-motion-menu: 160ms;
  --vh-motion-panel: 200ms;
  --vl-text-scale: 1;
  --vh-message-size: calc(1rem * var(--vl-text-scale));
  --vh-topbar-height: 56px;
  --vh-list-width: 288px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  font-weight: 400;
  text-rendering: optimizeLegibility;
  background: var(--vh-bg);
  color: var(--vh-text);
}
:root[data-vh-font="17"] { --vl-text-scale: 1.1333333333; }
:root[data-vh-font="19"] { --vl-text-scale: 1.2666666667; }

* { box-sizing: border-box; }
html, body { width: 100%; min-width: 0; min-height: 100%; margin: 0; }
body { font-size: calc(0.875rem * var(--vl-text-scale)); line-height: 1.5; background: var(--vh-bg); }
button, input, textarea, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: default; }
a { color: var(--vh-accent); text-underline-offset: 4px; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--vh-accent); outline-offset: 3px; }
input, textarea, select { accent-color: var(--vh-accent); }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
::selection { color: var(--vh-accent-ink); background: var(--vh-accent); }
.vh-sr-only, .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.vh-app { width: 100%; min-height: 100dvh; overflow: clip; }
.vh-skip-link { position: fixed; z-index: 200; top: 8px; left: 12px; padding: 10px 16px; color: var(--vh-accent-ink); background: var(--vh-accent); border-radius: 7px; transform: translateY(-160%); }
.vh-skip-link:focus { transform: none; }
.vh-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.vh-mark { height: 30px; width: 30px; flex-shrink: 0; color: var(--vh-text); }
.vh-topbar { min-height: var(--vh-topbar-height); display: flex; align-items: center; gap: 20px; padding: 4px 22px; background: var(--vh-bg); border-bottom: 1px solid var(--vh-line); }
.vh-topbar>button { min-height: 44px; padding: 0; border: 0; background: none; }
.vh-topbar>.vh-icon-button { width: 44px; margin-left: auto; }
.vh-wordmark { display: inline-flex; align-items: center; gap: 10px; color: var(--vh-text); text-decoration: none; min-width: 0; }
.vh-wordmark>span { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
.vh-wordmark b, .vh-wordmark strong { color: var(--vh-text); font-size: calc(0.875rem * var(--vl-text-scale)); font-weight: 730; letter-spacing: .075em; line-height: 1.4; }
.vh-wordmark small { color: var(--vh-muted); font-size: calc(.75rem * var(--vl-text-scale)); font-weight: 450; letter-spacing: .09em; line-height: 1.4; }
.vh-quick-search { display: flex; align-items: center; gap: 10px; width: min(440px, 40vw); min-height: 36px; margin-left: auto; padding: 6px 10px; color: var(--vh-muted); background: var(--vh-side); border: 1px solid var(--vh-line); border-radius: 6px; font-size: calc(.875rem * var(--vl-text-scale)); }
.vh-quick-search kbd { margin-left: auto; color: var(--vh-muted); font: calc(0.75rem * var(--vl-text-scale)) ui-monospace, monospace; border: 1px solid var(--vh-control-line); border-radius: 4px; padding: 1px 5px; }
.vh-edition { margin-left: auto; color: var(--vh-muted); font-size: calc(0.75rem * var(--vl-text-scale)); letter-spacing: .025em; }
.vh-eyebrow { display: block; color: var(--vh-muted); font-size: calc(0.75rem * var(--vl-text-scale)); font-weight: 600; line-height: 1.5; letter-spacing: .025em; }
.vh-primary, .vh-secondary, .vh-danger, .vh-icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 10px 15px; border: 1px solid transparent; border-radius: 6px; font-size: calc(.875rem * var(--vl-text-scale)); font-weight: 600; line-height: 1.45; text-decoration: none; transition: background-color var(--vh-motion-control) ease, border-color var(--vh-motion-control) ease, color var(--vh-motion-control) ease; }
.vh-primary { color: var(--vh-accent-ink); background: var(--vh-accent); border-color: var(--vh-accent); }
.vh-primary:hover { background: var(--vh-accent-hover); border-color: var(--vh-accent-hover); }
.vh-secondary { color: var(--vh-copy); background: var(--vh-side); border-color: var(--vh-control-line); }
.vh-secondary:hover { color: var(--vh-text); background: #ffffff0a; border-color: var(--vh-accent); }
.vh-danger { color: var(--vh-danger); background: var(--vh-danger-surface); border-color: var(--vh-control-line); }
.vh-danger:hover { color: var(--vh-danger); background: var(--vh-danger-surface); border-color: var(--vh-danger); }
.vh-icon-button { width: 44px; padding: 10px; color: var(--vh-muted); background: transparent; flex-shrink: 0; }
.vh-icon-button:hover { color: var(--vh-text); background: #ffffff08; }
.vh-primary:disabled, .vh-secondary:disabled, .vh-danger:disabled { color: var(--vh-muted); border-color: var(--vh-line); background: var(--vh-side); opacity: 1; }
.vh-primary[aria-busy="true"], .vh-secondary[aria-busy="true"], .vh-form[aria-busy="true"] { cursor: progress; }
.vh-text-button { min-height: 44px; padding: 8px 0; border: 0; background: none; color: var(--vh-accent); font-size: calc(.875rem * var(--vl-text-scale)); text-align: left; }
.vh-text-button:hover { text-decoration: underline; text-underline-offset: 4px; }
.vh-primary .vh-icon, .vh-secondary .vh-icon, .vh-danger .vh-icon { height: 18px; width: 18px; }

/* A practical login screen: a short introduction beside the account form. */
.vh-auth { display: grid; grid-template-columns: minmax(0, 490px) minmax(0, 400px); justify-content: center; align-items: center; gap: clamp(36px, 6vw, 88px); min-height: calc(100dvh - var(--vh-topbar-height)); padding: 44px 40px 64px; }
.vh-auth-intro { align-self: center; max-width: 490px; }
.vh-auth-intro>.vh-mark { width: 48px; height: 48px; margin-bottom: 23px; color: var(--vh-accent); }
.vh-auth-intro h1 { color: var(--vh-text); font-size: calc(clamp(1.875rem, 3vw, 2.125rem) * var(--vl-text-scale)); line-height: 1.2; letter-spacing: -.035em; font-weight: 620; margin: 0 0 12px; text-wrap: balance; }
.vh-auth-intro p { color: var(--vh-muted); max-width: 370px; font-size: calc(1rem * var(--vl-text-scale)); line-height: 1.65; margin: 0; }
.vh-auth-product { display: inline-flex; align-items: baseline; gap: 9px; margin-top: 26px; color: var(--vh-copy); font-size: calc(0.75rem * var(--vl-text-scale)); font-weight: 650; letter-spacing: .07em; }
.vh-auth-product small { color: var(--vh-muted); font-size: calc(0.75rem * var(--vl-text-scale)); font-weight: 500; letter-spacing: .08em; }
.vh-auth-card { min-width: 0; padding: 28px; background: var(--vh-side); border: 1px solid var(--vh-line); border-radius: 10px; box-shadow: none; }
.vh-auth>.vh-auth-card:only-child { grid-column: 1 / -1; justify-self: center; width: min(420px, 100%); }
.vh-auth-card h1 { font-size: calc(1.875rem * var(--vl-text-scale)); font-weight: 650; line-height: 1.2; letter-spacing: -.025em; margin: 0 0 12px; }
.vh-auth-card h2 { font-size: calc(1.3125rem * var(--vl-text-scale)); font-weight: 620; letter-spacing: -.02em; margin: 0 0 10px; }

      <footer class="ve-footer"><span>A place between days.</span></footer>`;
    status = overlay.querySelector('[data-ve-status]');
    overlay.querySelector('[data-ve-skip]').addEventListener('click', () => dismiss({immediate:true, focus:true}));
    document.body.appendChild(overlay);
    root.inert = true;
    window.addEventListener('voidline:home-ready', inspect);
    window.addEventListener('pagehide', pagehide);
    window.addEventListener('voidline:theme', themechange);
    document.addEventListener('keydown', keydown);
    document.addEventListener('focusin', focusin);
    document.addEventListener('visibilitychange', visibility);
    if (typeof MutationObserver === 'function') {
      observer = new MutationObserver(inspect);

<script data-source="cosmetics.js">
/* Collections use authoritative account records. Art preview is deliberately transaction-free. */
(() => {
 'use strict';
 let app,accountId='',epoch=0,loadTask=null,loaded=false,items=[],owned=new Set(),equipped=null,giftsEnabled=true,pending=0,view='browse',page=0,giftBox='inbox',mutationBusy=false,writeVersion=0,mutationSerial=0,panelIntent=0,instances=[],claimedDesigns=new Set(),showcase=[],earned=[],collectionVisibility='shared',transferBox='inbox',instanceFilter='',badgeFilter='all',ownershipRecords=[],collectedReceipt=null,stopReveal=null,badgeDefinitions=[],badgeAwards=[];
 let collectionMarkup='',hubSection='browse',kindFilter='all',seriesFilter='all',searchQuery='',pageMode=false,returnToProfile=null,hoverNode=null,hoverTimer=null,previewSerial=0,hubFrame=null,activePanel='browse',entryPrepared=false,instancesOffset=0,transferOffset=0;
 const collectionPositions=new Map();
 const $=id=>document.getElementById(id),state=()=>app?.state||{},esc=value=>app.esc(value),fixed=id=>items.find(item=>item.id===id);
 function art(id,mini=false){return window.VoidCollectibleArt?.render(id,mini)||'';}
 function earnedArt(id,mini=false){return window.VoidCollectibleArt?.earned(id,mini)||'';}
 function detailArt(id){return window.VoidCollectibleArt?.detail?.(id)||art(id);}
 function identity(){const next=state().account?.id||'';if(next===accountId)return;resetIdentity();accountId=next;}
 function resetIdentity(){endReveal();collectedReceipt=null;badgeDefinitions=[];badgeAwards=[];ownershipRecords=[];collectionPositions.clear();accountId='';epoch++;panelIntent++;mutationSerial++;mutationBusy=false;writeVersion++;loadTask=null;loaded=false;items=[];owned=new Set();equipped=null;pending=0;giftsEnabled=true;instances=[];claimedDesigns=new Set();showcase=[];earned=[];collectionVisibility='shared';instanceFilter='';transferBox='inbox';badgeFilter='all';collectionMarkup='';hubSection='browse';kindFilter='all';seriesFilter='all';searchQuery='';pageMode=false;returnToProfile=null;view='browse';hubFrame=null;activePanel='browse';entryPrepared=false;instancesOffset=0;transferOffset=0;}
 function guard(){identity();const e=epoch,id=accountId,parent=app.guard();return ()=>epoch===e&&id===state().account?.id&&parent();}
 function refreshChrome(){syncBrowseMarkup();if(!state().secureRoomId&&!state().nativeId&&!state().channelId)app.render();}
 function applyInventory(data){ownershipRecords=data.owned||[];owned=new Set((data.owned||[]).map(item=>item.cosmetic_id));equipped=data.equippedId||null;pending=Number(data.pendingGifts)||0;giftsEnabled=data.giftsEnabled!==false;instances=data.instances||[];claimedDesigns=new Set(data.claimedDesigns||[]);showcase=data.showcase||[];earned=data.earnedBadges||[];collectionVisibility=data.collectionVisibility||'shared';}
 async function refresh(render=false){
  identity();if(!accountId)return;if(loadTask)return loadTask;const current=guard(),version=writeVersion;
  const task=(async()=>{try{const [catalog,inventory]=await Promise.all([app.request('/api/cosmetics/catalog'),app.request('/api/cosmetics/inventory')]);if(!current()||version!==writeVersion)return;items=catalog.items||[];applyInventory(inventory);loaded=true;if(render)refreshChrome();}catch(_){if(current()&&version===writeVersion)loaded=false;}})();loadTask=task;try{await task;}finally{if(loadTask===task)loadTask=null;}
 }
 function accountHTML(){identity();if(!accountId)return '';return `<section class="vc-account"><header><div><h2>Collection</h2><p>Your decorations, owned gifts and earned achievements.</p></div>${equipped?`<span class="vc-equipped-mark" title="${esc(fixed(equipped)?.name||'Equipped badge')}">${art(equipped,true)}</span>`:''}</header><div class="vc-account-actions"><button class="vh-secondary" data-home="cosmetics-collection">Open collection${loaded?` <span>${owned.size}</span>`:''}</button><button class="vh-secondary" data-home="cosmetics-inbox">Gift requests${pending?` <span class="vc-count">${pending}</span>`:''}</button></div></section>`;}
 function navHTML(){identity();if(typeof app.openPage==='function')return '';return accountId?`<button class="vc-nav ${state().view==='collection'?'is-active':''}" data-home="cosmetics-collection" ${state().view==='collection'?'aria-current="page"':''}><svg class="vc-nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 5v9l-8 4-8-4V8Zm0 0v9m-8-4 8 4 8-4m-8 4v9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Collection${pending?`<span class="vc-count" aria-label="${pending} pending gift requests">${pending}</span>`:''}</button>`:'';}
 const errors='<p class="vc-error" id="vc-error" role="alert"></p>';
 function errorNode(error){const dialog=$('home-dialog'),node=(dialog?.open?dialog.querySelector?.('#vc-error'):null)||$('vc-page-error')||(!pageMode?$('vc-error'):null);if(node)node.textContent=error.message||'This action could not finish. Please retry.';else app.announce(error.message||'Please retry.');}
 function dialog(title,copy,html,layout='detail'){endReveal();return app.showDialog(title,copy,`<div class="vc-panel" data-vc-layout="${layout}">${html}</div>`);}
 function hubTabs(selected=hubSection){return `<nav class="vc-hub-tabs" aria-label="Collection sections">${[['browse','Browse'],['collected','Collected'],['requests','Gifts'],['earned','Earned']].map(([id,label])=>`<button data-vc-action="section" data-section="${id}" ${selected===id?'aria-current="page"':''}>${label}${id==='requests'&&pending?`<span class="vc-count">${pending}</span>`:''}</button>`).join('')}</nav>`;}
 function hubHTML(){if(!hubFrame)return '<div class="vc-destination"><h1>Collection</h1><p role="status">Loading your collection…</p></div>';const {title,copy,html,layout}=hubFrame;return `<div class="vc-destination vc-panel" data-vc-layout="${layout}"><header class="vc-destination-heading"><div><h1>Collection</h1><p>Decorations, gifts and earned achievements.</p></div><span class="vc-destination-summary">${loaded?`${items.filter(i=>i.type==='badge').length} decorations · ${items.filter(i=>i.type==='gift').length} gifts`:loadTask?'Loading catalog…':'Catalog unavailable'}</span></header>${hubTabs()}<section class="vc-section-heading"><h2>${esc(title)}</h2><p>${esc(copy)}</p></section>${html}</div>`;}
 function hubRegion(id,html){return `<div id="${id}" role="status"><!--vc:${id}-->${html}<!--/vc:${id}--></div>`;}
 function setHubRegion(id,html){const node=$(id);if(node)node.innerHTML=html;if(!hubFrame)return;const start='<!--vc:'+id+'-->',end='<!--/vc:'+id+'-->',a=hubFrame.html.indexOf(start),b=hubFrame.html.indexOf(end);if(a>=0&&b>=a){hubFrame.html=hubFrame.html.slice(0,a+start.length)+html+hubFrame.html.slice(b);collectionMarkup=hubHTML();}}
 function syncBrowseMarkup(){if(!hubFrame||activePanel!=='browse'||!loaded)return;hubFrame.html=(`${errors}${browseMarkup()}`).replaceAll('id="vc-error"','id="vc-page-error"');collectionMarkup=hubHTML();}
 function presentHub(title,copy,html,layout='collection'){
  endReveal();returnToProfile=null;hubFrame={title,copy,html:html.replaceAll('id="vc-error"','id="vc-page-error"'),layout};collectionMarkup=hubHTML();
  if(typeof app.openPage==='function'&&typeof app.refreshPage==='function'){
   pageMode=true;app.closeDialog?.();if(state().view==='collection')app.refreshPage('collection');else{entryPrepared=true;const opened=app.openPage('collection');if(opened===false)entryPrepared=false;}return state().dialogGeneration;
  }
  pageMode=false;return dialog(title,copy,`${hubTabs()}${html}`,layout);
 }
 function pageArrived(){if(entryPrepared){entryPrepared=false;return;}if(activePanel==='gifts')return inbox(giftBox,page);if(activePanel==='transfers')return showTransferInbox(transferBox,transferOffset);if(activePanel==='earned')return badgeDirectory();if(activePanel==='instances')return inventoryPanel(instancesOffset,instanceFilter);return collection(view,badgeFilter,'',true);}
 function collectionHost(){const panel=document.querySelector?.('.vc-panel[data-vc-layout="collection"]');return panel?.closest?.('dialog')||panel?.closest?.('#home-main')||(state().view==='collection'?$('home-main'):null);}
 function positionKey(){return hubSection+':'+view+':'+badgeFilter+':'+seriesFilter+':'+searchQuery;}
 function rememberCollection(){const host=collectionHost();if(host)collectionPositions.set(positionKey(),host.scrollTop||0);}
 function restoreCollection(focusId){const host=collectionHost();if(!host)return;const current=guard(),ticket=state().dialogGeneration,restore=()=>{if(!current()||ticket!==state().dialogGeneration)return;host.scrollTop=collectionPositions.get(positionKey())||0;if(focusId)host.querySelector?.(`[data-vc-action="inspect"][data-item="${focusId}"]`)?.focus({preventScroll:true});};if(window.requestAnimationFrame)window.requestAnimationFrame(restore);else restore();}
 function itemCategory(item){return item.category||(item.type==='gift'?'gifts':'originals');}
 const badgeCategories=[['all','All series'],['originals','VOIDLINE'],['crypto','Chain Signals'],['memes','Internet Relics'],['ego','Ego Archive'],['guild','Afterhours Guild'],['owned','Collected']];
 function categoryCopy(filter){return filter==='crypto'?'Chain Signals · Free profile art, not tokens or wallet holdings. No official affiliation.':filter==='memes'?'Internet Relics · Expressions and props drawn from familiar internet jokes.':filter==='ego'?'Ego Archive · Cameos, marginalia and original philosophical props.':filter==='guild'?'Afterhours Guild · Carefully constructed equipment for committed roleplay.':filter==='originals'?'VOIDLINE Originals · The original afterhours identities, redrawn.':filter==='owned'?'Only decorations you deliberately added to this account.':'Every item is free. Browsing and animation previews never collect or send an item.';}
 function ownedCopy(item){const record=ownershipRecords.find(row=>row.cosmetic_id===item.id),count=instances.filter(row=>row.catalog_id===item.id).length;return !owned.has(item.id)?item.type==='gift'&&claimedDesigns.has(item.id)?'Free claim already used; no instance currently owned':'Not collected':item.type==='gift'?`${count||'One or more'} owned ${count===1?'instance':'instances'}${instances.length>=200?' in the loaded inventory':''}`:record?.claimed_at?'Collected '+new Date(record.claimed_at).toLocaleDateString():'Collected on this account';}
 function itemState(item){const ownedState=equipped===item.id?'Equipped':owned.has(item.id)?'Collected':null;return ownedState?ownedState+(item.active===false?' · Retired design':''):item.active===false?'Retired design':item.type==='gift'&&claimedDesigns.has(item.id)?'Free claim used':'Free to collect';}
 function collectionCard(item){
  const collected=owned.has(item.id),stateCopy=itemState(item);return `<article class="vc-card ${collected?'is-owned':''}" data-vc-category="${esc(itemCategory(item))}"><button class="vc-art-button" data-vc-action="inspect" data-item="${esc(item.id)}" aria-label="Inspect ${esc(item.name)}"><span class="vc-card-stage" data-vc-hover="${esc(item.id)}">${art(item.id)}</span></button><div class="vc-card-copy"><span class="vc-series">${esc(item.series||'VOIDLINE Originals')}</span><h3><button data-vc-action="inspect" data-item="${esc(item.id)}">${esc(item.name)}</button></h3><span class="vc-card-state ${collected?'is-collected':''}">${esc(stateCopy)}</span></div><div class="vc-card-actions">${!collected?item.active===false||item.type==='gift'&&claimedDesigns.has(item.id)?`<button class="vc-card-link" data-vc-action="inspect" data-item="${esc(item.id)}">View design</button>`:`<button class="vc-card-link" data-vc-action="claim" data-item="${esc(item.id)}">Add to collection</button>`:item.type==='badge'?`<button class="vc-card-link ${equipped===item.id?'is-equipped':''}" data-vc-action="equip" data-item="${esc(item.id)}" aria-pressed="${equipped===item.id}">${equipped===item.id?'Equipped':'Equip decoration'}</button>`:`<button class="vc-card-link" data-vc-action="instances" data-filter="${esc(item.id)}">View owned instances</button>`}<span class="vc-card-kind">${item.type==='badge'?'Decoration':'Gift'}</span></div></article>`;
 }
 function selectedDesigns(){const query=searchQuery.trim().toLocaleLowerCase();return items.filter(item=>(kindFilter==='all'||item.type===kindFilter)&&(hubSection!=='collected'||owned.has(item.id))&&(badgeFilter==='all'||badgeFilter==='owned'&&owned.has(item.id)||itemCategory(item)===badgeFilter)&&(seriesFilter==='all'||item.series===seriesFilter)&&(!query||[item.name,item.series,item.description,item.inspiration,item.finish,...(item.aliases||[])].filter(Boolean).join(' ').toLocaleLowerCase().includes(query)));}

 function quietNow(date=new Date()){const quiet=preferences.notifications?.quietHours;if(!quiet?.enabled)return false;let hour=date.getUTCHours(),minute=date.getUTCMinutes();try{const parts=new Intl.DateTimeFormat('en-GB',{timeZone:quiet.timeZone||'UTC',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);hour=Number(parts.find(p=>p.type==='hour').value);minute=Number(parts.find(p=>p.type==='minute').value);}catch{}const at=hour*60+minute,parse=v=>Number(v.slice(0,2))*60+Number(v.slice(3)),start=parse(quiet.start),end=parse(quiet.end);return start===end?true:start<end?at>=start&&at<end:at>=start||at<end;}

g_id)}<span>${esc(g.name||g.catalog_id.replace(/^gift-/,'').replaceAll('-',' '))}</span></button>${g.sender_username?`<small>From @${esc(g.sender_username)}</small>`:''}</article>`).join('')}</div></div>`:''}${!compact&&p.collectionVisible===false?'<p class="vp-private">This collection is private.</p>':''}${editing?'':'<div class="vp-card-actions">'+(p.id===identity?'<button class="vh-secondary" data-vp-action="edit">Edit profile</button><button class="vh-secondary" data-vp-action="popover">Compact preview</button>':`<button class="vh-secondary" data-vp-action="full" data-account="${esc(p.id)}">Full profile</button>`)+(p.collectionVisible!==false?`<button class="vh-secondary" data-vp-action="collection" data-account="${esc(p.id||identity)}">View gifts</button>`:'')+'</div>'}</div></section>`;

 const options=(values,value)=>values.map(v=>`<option value="${v}" ${value===v?'selected':''}>${esc(v[0].toUpperCase()+v.slice(1))}</option>`).join('');

 function showEditor(profile,draft=clean(profile)){

 async function save(form){if(busy)return;if(editor?.cropFile){error(Error('Upload or cancel the selected crop before saving the profile.'));return;}const current=guard(),ticket=state().dialogGeneration,payload=formValue(form),serial=++writeSerial,button=form.querySelector('[type="submit"]');busy=true;writeVersion++;if(button)button.disabled=true;try{const result=await app.request('/api/profiles/me',payload);if(!current()||ticket!==state().dialogGeneration||!form.isConnected)return;cached=result.profile;Object.assign(state().account,{displayName:cached.displayName,bio:cached.bio,status:cached.status,avatar:cached.avatar,avatarMedia:cached.avatarMedia,bannerMedia:cached.bannerMedia});cancelStaged([cached.avatarMedia?.id,cached.bannerMedia?.id,editor.draft.avatarMediaId,editor.draft.bannerMediaId]);editor.uploads.delete(cached.avatarMedia?.id);editor.uploads.delete(cached.bannerMedia?.id);editor.profile=cached;editor.committed=clean(cached);const latest=formValue(form);dirty=!!editor.cropFile||JSON.stringify(clean(latest))!==JSON.stringify(clean(editor.committed));const node=$('vp-save-state');if(node)node.textContent=dirty?'Saved the submitted version. Newer edits are still unsaved.':'Profile saved';updatePreview(form);if(!dirty)app.announce('Profile saved.');else app.announce('Earlier profile changes saved. Your newer edits are still unsaved.');window.VoidCosmetics?.refresh?.();}catch(reason){if(current()&&ticket===state().dialogGeneration)error(reason);}finally{if(serial===writeSerial)busy=false;if(current()&&button?.isConnected)button.disabled=false;}}
 function beforeCloseDialog(){if(!dirty||!editor)return true;if(discardPrompt)return false;const form=$('vp-editor');if(!form)return true;const value=formValue(form),profile=editor.profile;discardPrompt=true;window.VoidProfileMedia?.disposeAll();app.showDialog('Discard profile changes?','Your newer edits have not been saved.', '<div class="vp-actions"><button class="vh-danger" data-vp-action="confirm-discard">Discard changes</button><button class="vh-secondary" data-vp-action="keep-editing">Keep editing</button></div>');editor.pending=value;editor.profile=profile;return false;}
 async function viewCollection(id,offset=0){const current=guard(),ticket=app.showDialog('Gift collection','The owner controls who can see this collection.', '<div id="vp-collection" role="status">Loading collection…</div>');try{const result=await app.request('/api/cosmetics/collections/'+encodeURIComponent(id)+'?offset='+offset);if(!current()||ticket!==state().dialogGeneration)return;const node=$('vp-collection');if(node)node.innerHTML=result.instances.map(item=>`<article class="vp-collection-item">${art(item.catalog_id)}<span>${esc(item.name||item.catalog_id.replace(/^gift-/,'').replaceAll('-',' '))}</span></article>`).join('')||'<p class="vp-private">No gift instances in this collection.</p>';if(result.total>30)node?.insertAdjacentHTML('beforeend',`<div class="vp-actions"><button class="vh-secondary" data-vp-action="collection-page" data-account="${esc(id)}" data-offset="${Math.max(0,offset-30)}" ${offset?'':'disabled'}>Previous</button><span>${offset+1}–${Math.min(offset+30,result.total)} of ${result.total}</span><button class="vh-secondary" data-vp-action="collection-page" data-account="${esc(id)}" data-offset="${offset+30}" ${result.page.hasMore?'':'disabled'}>Next</button></div>`);}catch(reason){if(current()&&ticket===state().dialogGeneration){const node=$('vp-collection');if(node)node.textContent='This collection is private or unavailable.';}}}
 function action(name,button){if(name==='inspect-gift'){const current=guard(),id=button?.dataset?.item,profileId=button?.dataset?.account||identity;if(!id||!window.VoidCosmetics?.openItem)return app.announce('Gift inspection could not load. Refresh and try again.');return window.VoidCosmetics.openItem(id,{returnTo:()=>{if(current())return openProfile(profileId);}});}if(name==='edit')return edit();if(name==='popover')return openProfile(identity,true);if(name==='full')return openProfile(button.dataset.account||identity);if(name==='collection-page')return viewCollection(button.dataset.account,Number(button.dataset.offset)||0);if(name==='collection')return viewCollection(button.dataset.account||identity);if(name==='discard')return beforeCloseDialog();if(name==='keep-editing'&&editor)return showEditor(editor.profile,editor.pending||clean(editor.profile));if((name==='reset-avatar'||name==='reset-banner')&&editor){const kind=name.slice(6),id=editor.draft[kind+'MediaId'];editor.draft[kind+'MediaId']=null;if(editor.uploads.has(id)){app.request('/api/media/'+id+'/cancel',{}).catch(()=>{});editor.uploads.delete(id);}if(editor.cropKind===kind){window.VoidProfileMedia?.disposeAll();editor.cropFile=null;editor.cropKind=null;}updatePreview($('vp-editor'));return;}if(name==='confirm-discard'){cancelStaged();window.VoidProfileMedia?.disposeAll();dirty=false;editor=null;discardPrompt=false;app.closeDialog();}}
 function init(bridge){if(app)return;app=bridge;sync();document.addEventListener('error',event=>{if(event.target.matches?.('img[data-vp-photo]'))event.target.remove();},true);document.addEventListener('click',event=>{const button=event.target.closest('[data-vp-action],[data-vp-award]');if(!button||!state().account)return;event.preventDefault();if(button.dataset.vpAward)return window.VoidCosmetics?.badgeDirectory?.();Promise.resolve(action(button.dataset.vpAction,button)).catch(error);});document.addEventListener('submit',event=>{if(event.target.dataset.vpForm!=='profile'||!state().account)return;event.preventDefault();save(event.target);});document.addEventListener('change',event=>{if(event.target.dataset.vpFile&&state().account&&editor){const file=event.target.files?.[0];if(file)mountCrop(file,event.target.dataset.vpFile);event.target.value='';}});for(const type of ['input','change'])document.addEventListener(type,event=>{const form=event.target.closest('[data-vp-form="profile"]');if(form)updatePreview(form);});window.addEventListener('voidline:cosmetics-changed',event=>{sync();const editing=()=>!!$('vp-editor')?.isConnected;if(!identity||event.detail?.accountId!==identity||editing()||dirty)return;const current=guard(),version=writeVersion;app.request('/api/profiles/me').then(result=>{if(!current()||version!==writeVersion||editing()||dirty)return;cached=result.profile;Object.assign(state().account,{avatarMedia:cached.avatarMedia,bannerMedia:cached.bannerMedia});if(state().view==='you')app.render();}).catch(()=>{});});window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});}
 const extension={id:'profiles',init,profileHTML,openProfile,openPopover:id=>openProfile(id,true),hasUnsavedChanges:()=>dirty,beforeCloseDialog,handles:name=>name==='profile'||name==='profile-view',handleAction:name=>{if(name==='profile'){edit();return true;}if(name==='profile-view'){openProfile(identity);return true;}return false;},onAccount:refresh,onLock(){identity='';epoch++;writeVersion++;writeSerial++;cached=null;editor=null;dirty=false;busy=false;discardPrompt=false;window.VoidProfileMedia?.disposeAll();}};
 window.VoidProfilesPanel=Object.freeze({extension,openProfile,edit,profileCard,avatar});
 function register(){if(window.VoidHome?.registerExtension)window.VoidHome.registerExtension(extension);}
 window.addEventListener('voidline:home-ready',register,{once:true});register();
})();

<script data-source="admin.js">
/* Platform controls are visible only after the server confirms the owner. */
(() => {
 'use strict';
 let home=null,identity='',epoch=0,ownerStatus=null,section='users',offset=0,query='',reportStatus='open',panel=0;
 const $=id=>document.getElementById(id);
 const esc=value=>home.esc(value);
 const encode=value=>encodeURIComponent(String(value));
 const sections=[['users','Accounts'],['communities','Communities'],['reports','Reports'],['catalog','Gift catalog'],['badges','Badge definitions'],['awards','Badge awards'],['audit','Audit trail'],['health','Health']];
 function sync(){const id=home?.state.account?.id||'';if(id!==identity){identity=id;epoch++;panel++;ownerStatus=null;section='users';offset=0;query='';reportStatus='open';}}
 function guard(){sync();const e=epoch,id=identity,parent=home.guard();return ()=>e===epoch&&id===home.state.account?.id&&parent();}
 const date=value=>value?new Date(value).toLocaleString():'—';
 function fail(error){const node=$('va-error');if(node?.isConnected)node.textContent=error.message||'The request could not finish.';else home.announce(error.message||'The request could not finish.');}
 async function status(){sync();if(!identity)return;const current=guard();try{const data=await home.request('/api/admin/status');if(current()){ownerStatus=data;home.render();}}catch{if(current())ownerStatus=null;}}
 function navHTML(){sync();return ownerStatus?.isOwner?'<button class="vh-nav-item" data-home="admin-open">Administration</button>':'';}
 function accountHTML(){sync();if(ownerStatus?.isOwner)return '<button class="va-account" data-home="admin-open"><span><b>Platform administration</b><small>Verified owner · passkey confirmation required</small></span></button>';
  return ownerStatus&&!ownerStatus.ownerConfigured?'<button class="va-account" data-home="admin-owner-claim"><span><b>Owner verification request</b><small>For the intended owner: prove this account to the trusted server operator</small></span></button>':'';
 }
 async function stepUp(){
  if(Number(home.state.session?.reauthenticatedAt||0)<Date.now()-600000&&typeof home.reauthenticate==='function')await home.reauthenticate();
  if(typeof home.passkeyStepUp==='function')await home.passkeyStepUp();
  else throw Error('Confirm your password and verify a passkey in Devices and Security, then try again.');
 }
 async function claim(){
  const current=guard();try{
   await stepUp();if(!current())return;
   const data=await home.request('/api/admin/owner/claim',{});if(!current())return;
   home.showDialog('Verify this owner account','This request proves control of your current account. It does not grant administration.',`<section class="va-panel"><p>Give this private, five-minute request code to the trusted server operator. They must verify your request and bind the immutable account ID through server configuration.</p><label class="vh-field">Ownership request code<textarea id="va-owner-code" readonly rows="3" spellcheck="false">${esc(data.code)}</textarea></label><p>Account ID: <code>${esc(data.accountId)}</code></p><p>Expires ${esc(date(data.expiresAt))}. Public usernames and community roles cannot claim this access.</p><button class="vh-secondary" data-va-action="copy-claim">Copy request code</button><p class="va-error" id="va-error" role="alert"></p></section>`);
  }catch(error){if(current())fail(error);}
 }
 function pager(data){const p=data.page;if(!p)return '';return `<footer class="va-pages"><span>${p.total?`${p.offset+1}–${Math.min(p.offset+p.limit,p.total)} of ${p.total}`:'0 records'}</span><button class="vh-secondary" data-va-action="page" data-offset="${Math.max(0,p.offset-p.limit)}" ${p.offset?'':'disabled'}>Previous</button><button class="vh-secondary" data-va-action="page" data-offset="${p.offset+p.limit}" ${p.hasMore?'':'disabled'}>Next</button></footer>`;}
 function layout(){return `<section class="va-panel"><nav class="va-tabs" aria-label="Administration section">${sections.map(([key,label])=>`<button data-va-action="section" data-section="${key}" aria-current="${key===section?'page':'false'}">${label}</button>`).join('')}</nav>${['users','communities'].includes(section)?`<form data-va-form="search" class="va-search"><label for="va-query">${section==='users'?'Username or exact internal account ID':'Community name'}</label><div><input id="va-query" name="q" maxlength="100" value="${esc(query)}" autocomplete="off"><button class="vh-secondary" type="submit">Search</button></div></form>`:''}${section==='reports'?`<label class="vh-field">Report status<select id="va-report-filter">${[['open','Open'],['reviewing','Under review'],['resolved','Resolved'],['dismissed','Dismissed'],['all','All reports']].map(([value,label])=>`<option value="${value}" ${value===reportStatus?'selected':''}>${label}</option>`).join('')}</select></label>`:''}<p class="va-error" id="va-error" role="alert"></p><div id="va-results" class="va-results" role="status">Loading authorized records…</div></section>`;}
 async function open(next='users',pageOffset=0){
  sync();if(!identity)return;const current=guard();try{
   const data=await home.request('/api/admin/status');if(!current())return;ownerStatus=data;
   if(!data.isOwner)throw Error('This area is available only to the verified platform owner.');
   if(data.needsVerification){await stepUp();if(!current())return;}
   section=sections.some(([id])=>id===next)?next:'users';offset=Math.max(0,Number(pageOffset)||0);const ticket=++panel;
   home.showDialog('Platform administration','Actions are authorized by your immutable owner record and recorded in the audit trail.',layout());
   const generation=home.state.dialogGeneration,node=$('va-results');
   const search=new URLSearchParams({limit:'30',offset:String(offset)});if(query&&['users','communities'].includes(section))search.set('q',query);if(section==='reports')search.set('status',reportStatus);
   const result=await home.request('/api/admin/'+section+'?'+search);
   if(!current()||ticket!==panel||generation!==home.state.dialogGeneration||!node?.isConnected)return;
   node.innerHTML=content(result)+pager(result);
  }catch(error){if(current())fail(error);}
 }
 function content(data){
  if(section==='users')return data.users?.length?`<div class="va-table-wrap"><table><thead><tr><th>Account</th><th>Status / methods</th><th>Created</th><th>Actions</th></tr></thead><tbody>${data.users.map(a=>`<tr><td><b>${esc(a.displayName)}</b><span>@${esc(a.username||'deleted')}</span><code>${esc(a.id)}</code></td><td>${esc(a.status)}<span>${esc(a.methods.join(', ')||'No active authentication method')}</span><span>${a.verifiedEmail?'Verified recovery email':'No verified recovery email'}</span></td><td>${esc(date(a.createdAt))}</td><td class="va-row-actions">${a.id===identity?'<small>Current platform owner</small>':a.status==='deleted'?'<small>Retained reference only</small>':`<button class="vh-secondary" data-va-action="status-confirm" data-account="${esc(a.id)}" data-status="${a.status==='suspended'?'active':'suspended'}">${a.status==='suspended'?'Reinstate':'Suspend'}</button>`}<button class="vh-secondary" data-va-action="revoke-confirm" data-account="${esc(a.id)}">Revoke sessions</button><button class="vh-secondary" data-va-action="recovery" data-account="${esc(a.id)}">Recovery options</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="va-empty">No accounts match this search.</div>';
  if(section==='communities')return data.communities?.length?data.communities.map(c=>`<article class="va-record"><div><b>${esc(c.name)}</b><p>${esc(c.description)}</p><code>${esc(c.id)}</code><small>${Number(c.member_count)} members · Owner ${esc(c.owner_id||'unavailable')} · ${esc(date(c.created_at))}</small></div><button class="vh-secondary" data-va-action="community-confirm" data-community="${esc(c.id)}">Revoke all invitations</button></article>`).join(''):'<div class="va-empty">No communities match this search.</div>';
  if(section==='reports')return `<p class="va-note">${esc(data.contentDisclosure)}</p>`+(data.reports?.length?data.reports.map(r=>`<article class="va-record"><div><b>${esc(r.reason)}</b><small>${esc(r.target_type)} / ${esc(r.target_id)} · ${esc(r.status)} · ${esc(date(r.created_at))}</small><p class="va-report-detail">${esc(r.detail_text||'No additional content shared.')}</p><small>Reporter ${esc(r.reporter_id)}</small></div><button class="vh-secondary" data-va-action="report-review" data-report="${esc(r.id)}">Review report</button></article>`).join(''):'<div class="va-empty">No open reports.</div>');
  if(section==='catalog')return `<p class="va-note">Original gift designs remain free. Editing availability does not revoke existing ownership.</p>`+(data.gifts||[]).map(g=>`<article class="va-record"><div><b>${esc(g.name)}</b><p>${esc(g.description)}</p><small>${g.active===0?'Hidden from new claims':'Available'} · Free</small></div><button class="vh-secondary" data-va-action="catalog-edit" data-id="${esc(g.id)}" data-name="${esc(g.name)}" data-description="${esc(g.description)}" data-active="${g.active===0?'0':'1'}">Edit catalog entry</button></article>`).join('');
  if(section==='badges')return `<div class="va-toolbar"><p>Earned awards are distinct from free decorations and actual roles.</p><button class="vh-secondary" data-va-action="badge-create">Define reviewed badge</button></div>${(data.definitions||[]).map(b=>`<article class="va-record"><div><b>${esc(b.name)}</b><p>${esc(b.description)}</p><small>${esc(b.requirement)} · ${esc(b.rule)} · ${b.active?'Active':'Inactive'}</small></div>${b.active&&b.rule==='reviewed-contribution'?`<button class="vh-secondary" data-va-action="award-form" data-badge="${esc(b.id)}">Award after review</button>`:''}</article>`).join('')}`;
  if(section==='awards')return data.awards?.length?data.awards.map(a=>`<article class="va-record"><div><b>${esc(a.badge_id)}</b><code>${esc(a.account_id)}</code><small>${a.revoked_at?'Revoked '+esc(date(a.revoked_at)):'Awarded '+esc(date(a.issued_at))}</small><small>Issuer ${esc(a.issuer_id||'Authoritative server rule')}</small><p>${esc(a.reason)}</p></div>${!a.revoked_at?`<button class="vh-secondary" data-va-action="award-revoke" data-award="${esc(a.id)}">Revoke award</button>`:''}</article>`).join(''):'<div class="va-empty">No issued awards.</div>';
  if(section==='audit')return data.events?.length?data.events.map(e=>`<article class="va-record"><div><b>${esc(e.action)}</b><small>${esc(date(e.created_at))} · Actor ${esc(e.actor_id)}</small><code>${esc(e.target_type)} / ${esc(e.target_id)}</code><p>${esc(e.detail_json)}</p></div></article>`).join(''):'<div class="va-empty">No administrative actions recorded.</div>';
  return `<dl class="va-health"><div><dt>Database</dt><dd>${esc(data.database)}</dd></div><div><dt>Active accounts</dt><dd>${Number(data.accountCounts?.active)||0}</dd></div><div><dt>Suspended accounts</dt><dd>${Number(data.accountCounts?.suspended)||0}</dd></div><div><dt>Encrypted messaging service</dt><dd>${data.encryptionServiceConfigured?'Configured; separate acceptance tests required':'Not configured'}</dd></div><div><dt>Encrypted message contents</dt><dd>No owner decryption tool</dd></div><div><dt>Legacy text</dt><dd>Retained plaintext; outside this administration UI</dd></div><div><dt>Backup administration</dt><dd>Managed D1 provider; protected operator access required</dd></div></dl><p class="va-note">A healthy database does not verify a live encrypted exchange or a production backup restore. Use the documented isolated restore check.</p>`;
 }
 function form(title,copy,kind,fields,data={}){panel++;home.showDialog(title,copy,`<section class="va-panel"><form data-va-form="${kind}" ${Object.entries(data).map(([key,value])=>`data-${key}="${esc(value)}"`).join('')}><div class="va-fields">${fields}</div><p class="va-error" id="va-error" role="alert"></p><div class="va-actions"><button class="vh-primary" type="submit">Confirm</button><button class="vh-secondary" type="button" data-va-action="cancel">Cancel</button></div></form></section>`);}
 async function mutate(path,body,button,after){
  const current=guard(),ticket=panel,generation=home.state.dialogGeneration;if(button){button.disabled=true;button.setAttribute('aria-busy','true');}
  const valid=()=>current()&&ticket===panel&&generation===home.state.dialogGeneration&&(!button||button.isConnected);
  try{const data=await home.request('/api/admin/'+path,body);if(!valid())return;home.announce(data.delivery==='provider-accepted'?data.message:'Administrative change saved and audited.');if(after)await after(data);else await open(section,offset);}
  catch(error){if(valid())fail(error);}finally{if(current()&&button?.isConnected){button.disabled=false;button.removeAttribute('aria-busy');}}
 }
 function action(button){const d=button.dataset;
  if(d.vaAction==='section'){query='';return open(d.section);}
  if(d.vaAction==='page')return open(section,d.offset);
  if(d.vaAction==='cancel')return open(section,offset);
  if(d.vaAction==='copy-claim'){const node=$('va-owner-code');if(!navigator.clipboard?.writeText){node.focus();node.select();return;}return navigator.clipboard.writeText(node.value).then(()=>home.announce('Ownership request code copied.')).catch(()=>{node.focus();node.select();});}
  if(d.vaAction==='status-confirm')return form(d.status==='suspended'?'Suspend this account?':'Reinstate this account?','Existing sessions will be revoked. The reason is recorded in the audit trail.','account-status',`<label class="vh-field">Reason<textarea name="reason" minlength="5" maxlength="400" required rows="3"></textarea></label>`,{account:d.account,status:d.status});
  if(d.vaAction==='revoke-confirm')return form('Revoke account sessions?','This signs out the account on its devices. Your current owner session is retained unless explicitly included.','revoke-sessions','<label class="vh-check"><input name="includeCurrent" type="checkbox">Include my current session if this is my account</label>',{account:d.account});
  if(d.vaAction==='recovery')return form('Account recovery options','Recovery never reveals an existing password. Email delivery is available only through a configured verified channel.','recovery','<p>The user can recover with their own saved recovery method. No reset email will be fabricated if delivery is unavailable.</p>',{account:d.account});
  if(d.vaAction==='community-confirm')return form('Revoke every community invitation?','Current members retain membership. Future joins require a new invitation issued by the community.','community',`<label class="vh-field">Reason<textarea name="reason" minlength="5" maxlength="400" required rows="3"></textarea></label>`,{community:d.community});
  if(d.vaAction==='report-review')return form('Review this report','Only reporter-selected information is provided. This action does not decrypt a private conversation.','report','<label class="vh-field">Outcome<select name="status"><option value="reviewing">Under review</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select></label><label class="vh-field">Review note<textarea name="reason" minlength="5" maxlength="400" required rows="3"></textarea></label>',{report:d.report});
  if(d.vaAction==='catalog-edit')return form('Edit an official gift','The item remains free. Existing owned instances retain their identity.','catalog',`<label class="vh-field">Name<input name="name" value="${esc(d.name)}" minlength="2" maxlength="60" required></label><label class="vh-field">Description<textarea name="description" minlength="2" maxlength="300" required rows="3">${esc(d.description)}</textarea></label><label class="vh-check"><input name="active" type="checkbox" ${d.active==='1'?'checked':''}>Available for new gifts and claims</label>`,{item:d.id});
  if(d.vaAction==='badge-create')return form('Define a reviewed achievement','A reviewed badge needs an explicit contribution requirement. It grants no permission role.','badge','<label class="vh-field">Stable ID<input name="id" pattern="[a-z][a-z0-9-]{2,47}" maxlength="48" required placeholder="community-contributor"></label><label class="vh-field">Name<input name="name" minlength="2" maxlength="60" required></label><label class="vh-field">Meaning<textarea name="description" minlength="5" maxlength="300" required></textarea></label><label class="vh-field">Legitimate requirement<textarea name="requirement" minlength="10" maxlength="500" required></textarea></label>');
  if(d.vaAction==='award-form')return form('Award after review','Confirm the immutable account ID and record the reviewed contribution.','award','<label class="vh-field">Account ID<input name="accountId" maxlength="100" required autocomplete="off"></label><label class="vh-field">Review evidence<textarea name="reason" minlength="10" maxlength="500" required rows="3"></textarea></label>',{badge:d.badge});
  if(d.vaAction==='award-revoke')return form('Revoke this earned award?','The original issuance remains in the administrative audit trail.','award-revoke','<label class="vh-field">Reason<textarea name="reason" minlength="10" maxlength="500" required rows="3"></textarea></label>',{award:d.award});
 }
 async function submit(formNode){if(formNode.dataset.busy)return;formNode.dataset.busy='1';const data=Object.fromEntries(new FormData(formNode)),d=formNode.dataset,button=formNode.querySelector('[type="submit"]');try{
  if(d.vaForm==='search'){query=data.q||'';return await open(section,0);}
  if(d.vaForm==='account-status')return await mutate('users/'+encode(d.account)+'/status',{status:d.status,reason:data.reason},button);
  if(d.vaForm==='revoke-sessions')return await mutate('users/'+encode(d.account)+'/revoke-sessions',{includeCurrent:data.includeCurrent==='on'},button);
  if(d.vaForm==='recovery')return await mutate('users/'+encode(d.account)+'/recovery',{},button);
  if(d.vaForm==='community')return await mutate('communities/'+encode(d.community)+'/revoke-invites',{reason:data.reason},button);
  if(d.vaForm==='report')return await mutate('reports/'+encode(d.report)+'/resolve',data,button);
  if(d.vaForm==='catalog')return await mutate('catalog/'+encode(d.item),{name:data.name,description:data.description,active:data.active==='on'},button);
  if(d.vaForm==='badge')return await mutate('badges/'+encode(data.id),{name:data.name,description:data.description,requirement:data.requirement,rule:'reviewed-contribution',active:true},button);
  if(d.vaForm==='award')return await mutate('badges/'+encode(d.badge)+'/award',data,button);
  if(d.vaForm==='award-revoke')return await mutate('awards/'+encode(d.award)+'/revoke',data,button);
 }finally{delete formNode.dataset.busy;}}
 const extension={id:'admin',init(bridge){if(home)return;home=bridge;sync();document.addEventListener('click',event=>{const button=event.target.closest('[data-va-action]');if(!button||!home.state.account)return;event.preventDefault();Promise.resolve(action(button)).catch(fail);});document.addEventListener('submit',event=>{if(!event.target.dataset.vaForm||!home.state.account)return;event.preventDefault();submit(event.target).catch(fail);});document.addEventListener('change',event=>{if(event.target.id==='va-report-filter'&&home.state.account){reportStatus=['open','reviewing','resolved','dismissed','all'].includes(event.target.value)?event.target.value:'open';open('reports',0);}});},navHTML,accountHTML,handles:name=>['admin-open','admin-owner-claim'].includes(name),handleAction(name){if(name==='admin-open'){open();return true;}if(name==='admin-owner-claim'){claim();return true;}return false;},onAccount(){sync();status();},onLock(){identity='';epoch++;panel++;ownerStatus=null;}};
 window.VoidAdmin=Object.freeze({extension,open,claim});
 function register(){window.VoidHome?.registerExtension?.(extension);}window.addEventListener('voidline:home-ready',register,{once:true});register();
})();

</script>
<script data-source="notifications.js">
/* Explicit device opt-in. Opening settings never asks notification permission. */
(() => {
 'use strict';
 let app,identity='',epoch=0,actionToken=null;
 const $=id=>document.getElementById(id),esc=value=>app.esc(value);
 function sync(){const next=app.state.account?.id||'';if(next!==identity){identity=next;epoch++;actionToken=null;}}
 function guard(){sync();const id=identity,e=epoch,parent=app.guard();return ()=>id===app.state.account?.id&&e===epoch&&parent();}
 const supported=()=>!!navigator.serviceWorker&&'PushManager' in window&&'Notification' in window;
 const bytes=value=>Uint8Array.from(atob(value.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));
 async function settings(){const valid=guard(),ticket=app.showDialog('Notifications on this device','Notifications are optional. Native activity uses generic previews; encrypted Matrix notifications require separate service integration.','<section id="vn-settings" role="status">Loading notification settings…</section>');try{const data=await app.request('/api/notifications/config');if(!valid()||ticket!==app.state.dialogGeneration)return;const node=$('vn-settings');if(!node)return;node.innerHTML=`<p>${esc(data.privacy)}</p><p>${esc(!supported()?'This browser does not support Web Push here. Try the app in a supported browser tab.':data.reason)}</p><p>If this preview blocks browser permissions, <a href="/" target="_blank" rel="noopener noreferrer">open VOIDLINE in a browser tab</a>.</p><p>Browser permission: ${esc(supported()?Notification.permission:'unavailable')}</p><p>Private message text is never included. Quiet hours and chat mute settings apply. Provider acceptance does not confirm that a device displayed a notification.</p><p id="vn-error" role="alert"></p><div class="vo-actions"><button class="vh-primary" data-vn="enable" ${!supported()||!data.configured?'disabled':''}>Enable on this device</button><button class="vh-secondary" data-vn="disable" ${!supported()?'disabled':''}>Disable on this device</button><button class="vh-secondary" data-vn="test" ${!supported()||!data.configured||!data.subscriptions?.length?'disabled':''}>Send a test notification</button></div>`;}catch(error){if(valid()&&ticket===app.state.dialogGeneration){const node=$('vn-settings');if(node)node.textContent=error.message;}}}
 async function action(name){
  const valid=guard();if(actionToken)return;const token={};actionToken=token;const ticket=app.state.dialogGeneration,samePanel=()=>valid()&&ticket===app.state.dialogGeneration;
  const fail=message=>{if(samePanel()){const node=$('vn-error');if(node)node.textContent=message;}};
  try{
   if(!supported())throw Error('This browser does not support notifications.');
   if(name==='enable'){
    const config=await app.request('/api/notifications/config');if(!samePanel())return;if(!config.configured)throw Error(config.reason);
    const permission=await Notification.requestPermission();if(!samePanel())return;if(permission!=='granted')throw Error('Notification permission was not granted. You can change it in browser settings.');
    const registration=await navigator.serviceWorker.register('/push-worker.js',{scope:'/'});if(!samePanel())return;
    await navigator.serviceWorker.ready;if(!samePanel())return;
    let subscription=await registration.pushManager.getSubscription();if(!samePanel())return;
    if(subscription?.options?.applicationServerKey&&new Uint8Array(subscription.options.applicationServerKey).toString()!==bytes(config.publicKey).toString()){if(await subscription.unsubscribe()!==true)throw Error('The old notification subscription could not be removed. Try again.');subscription=null;}
    const created=!subscription;subscription=subscription||await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes(config.publicKey)});
    if(!samePanel()){if(created)await subscription.unsubscribe();return;}
    await app.request('/api/notifications/subscribe',{subscription:subscription.toJSON()});
    if(samePanel()){app.announce('Notification subscription saved. Use Send a test to check this device.');await settings();}return;
   }
   if(name==='disable'){
    const registration=await navigator.serviceWorker.getRegistration('/');if(!samePanel())return;
    const subscription=await registration?.pushManager.getSubscription();if(!samePanel())return;
    if(subscription&&await subscription.unsubscribe()!==true)throw Error('The browser did not confirm removal. Notifications may still be enabled; try again.');
    if(!samePanel())return;
    let config;try{config=await app.request('/api/notifications/config');}catch{throw Error('Browser notifications are stopped. Server cleanup could not finish; retry Disable when connected.');}
    if(!samePanel())return;for(const record of config.subscriptions||[]){if(!samePanel())return;await app.request('/api/notifications/remove/'+encodeURIComponent(record.id),{});}
    if(samePanel()){app.announce('Notifications disabled for this browser session.');await settings();}return;
   }
   if(name==='test'){const result=await app.request('/api/notifications/test',{});if(samePanel()&&result.queued)app.announce('Test notification queued. Device display is not yet confirmed.');}
  }catch(error){fail(error.message);}finally{if(actionToken===token)actionToken=null;}
 }
 const extension={id:'notifications',init(bridge){if(app)return;app=bridge;document.addEventListener('click',event=>{const button=event.target.closest('[data-vn]');if(!button||!app.state.account)return;event.preventDefault();action(button.dataset.vn);});},accountHTML(){sync();return identity?'<button class="vo-settings-link" data-home="notification-settings"><span><b>Notifications on this device</b><small>Optional generic browser notifications</small></span></button>':'';},handles:name=>name==='notification-settings',handleAction(name){if(name==='notification-settings'){settings();return true;}return false;},onAccount:sync,onLock(){identity='';epoch++;actionToken=null;}};
 window.VoidNotifications=Object.freeze({extension,settings});function register(){window.VoidHome?.registerExtension?.(extension);}window.addEventListener('voidline:home-ready',register,{once:true});register();
})();

</script>
<script data-source="account-export.js">
(function(){
 'use strict';
 let app=null,identity='',epoch=0,running=null;
 const state=()=>app?.state||{},MAX_BYTES=10*1024*1024,MAX_RECORDS=10000,PAGE_LIMIT=100,downloads=new Map();
 const scopes=[['profile','My profile'],['memberships','Community memberships'],['gifts','Owned gifts'],['badges','Earned badges'],['organization','Private organization & bookmark references'],['standard-native','Standard direct & group history'],['standard-community','Accessible Standard community history']];
 function cancel(){if(!running)return;const task=running;task.cancelled=true;running=null;task.release?.();}
 function revokeDownloads(){for(const [url,timer]of downloads){clearTimeout(timer);URL.revokeObjectURL(url);}downloads.clear();}
 function sync(){const id=state().account?.id||'';if(id!==identity){cancel();revokeDownloads();identity=id;epoch++;}}
 function dialog(){
  sync();if(!identity)return;cancel();
  app.showDialog('Your data','Choose exactly what to export. A recent identity confirmation is required. Previous device-local archives are never silently uploaded.',`<div class="vh-note"><b>Account export</b><p>These JSON files contain readable account records or Standard message text. Anyone with the file can read it. Store it privately. Encrypted Matrix messages, keys, passwords, recovery codes and device-only Saved notes and uploaded file bytes are excluded.</p></div><form data-ve-form="export"><label class="vh-field">Export scope<select name="scope">${scopes.map(([id,label])=>`<option value="${id}">${label}</option>`).join('')}</select></label><label class="vp-check"><input name="acknowledge" type="checkbox" required>I understand this download is readable plaintext.</label><div class="vp-actions"><button class="vh-primary" type="submit">Prepare private download</button><button class="vh-secondary" type="button" data-ve="cancel" hidden>Cancel preparation</button></div><p id="ve-status" role="status"></p><p id="ve-error" role="alert"></p><button class="vh-secondary" id="ve-reauth" type="button" data-home="reauthenticate" hidden>Confirm account identity</button></form><div class="vh-note"><b>Previous local archive</b><p>Review or export untouched records from this browser. Samples are kept separate from real account history.</p><button class="vh-secondary" data-home="review-local">Review previous archive</button><button class="vh-secondary" data-home="export-local">Export previous local archive</button></div><p>Device-only encrypted Saved notes and Matrix history have separate recovery boundaries. Account recovery does not recover missing encryption keys.</p><a class="vh-secondary" href="/downloads/voidline-source.zip" download>Download source</a><button class="vh-danger" data-home="delete-account">Delete account</button>`);
 }
 async function prepare(form){
  sync();if(running||!identity||!form.isConnected)return;
  const values=new FormData(form),scope=String(values.get('scope')||'');if(!scopes.some(([id])=>id===scope)||!values.get('acknowledge'))return;
  const parent=app.guard(),task={accountId:identity,epoch,ticket:state().dialogGeneration,cancelled:false},current=()=>!task.cancelled&&identity===task.accountId&&epoch===task.epoch&&state().account?.id===task.accountId&&state().dialogGeneration===task.ticket&&form.isConnected&&parent();
  const submit=form.querySelector('[type="submit"]'),cancelButton=form.querySelector('[data-ve="cancel"]'),status=document.getElementById('ve-status'),error=document.getElementById('ve-error');
  if(!submit||!cancelButton||!status||!error)return;
  running=task;submit.disabled=true;cancelButton.hidden=false;error.textContent='';
  task.release=()=>{if(form.isConnected){submit.disabled=false;cancelButton.hidden=true;}};
  try{
   const pages=[],seen=new Set(),encoder=new TextEncoder();let cursor=null,total=0,size=0;
   for(let page=0;page<100;page++){
    if(!current())return;
    status.textContent=`Preparing ${total} records…`;
    const data=await app.request('/api/export',{scope,acknowledgePlaintext:true,...(cursor?{cursor}:{}),limit:PAGE_LIMIT});
    if(!current())return;
    if(!data||typeof data!=='object'||Array.isArray(data)||data.format!=='voidline-account-export-v1'||!Array.isArray(data.records)||data.records.length>PAGE_LIMIT||!data.page||typeof data.page.hasMore!=='boolean'||data.page.limit!==PAGE_LIMIT||data.page.count!==data.records.length||data.scope!==scope||data.accountId!==task.accountId||data.encrypted!==false||data.includesFileBytes!==false)throw Error('The export page could not be verified. No partial file was downloaded.');
    size+=encoder.encode(JSON.stringify(data)).byteLength;total+=data.records.length;
    if(size>MAX_BYTES)throw Error('This scope exceeds the 10 MiB browser export limit. No partial file was downloaded. Use the documented operator export process.');
    if(total>MAX_RECORDS)throw Error('This scope exceeds the browser’s 10,000-record limit. No partial file was downloaded.');
    pages.push(data);
    if(!data.page.hasMore){
     const content=JSON.stringify({format:'voidline-scoped-export',version:1,scope,accountId:task.accountId,createdAt:new Date().toISOString(),confidentiality:'Readable plaintext. Excludes Matrix keys/history and device-only Saved notes.',pages},null,2),bytes=encoder.encode(content);
     if(bytes.byteLength>MAX_BYTES)throw Error('The formatted download exceeds the 10 MiB browser export limit. No partial file was downloaded.');
     if(!current())return;
     const url=URL.createObjectURL(new Blob([bytes],{type:'application/json'}));
     if(!current()){URL.revokeObjectURL(url);return;}
     try{const link=document.createElement('a');link.href=url;link.download=`voidline-${scope}-${new Date().toISOString().slice(0,10)}.json`;link.click();}catch(reason){URL.revokeObjectURL(url);throw reason;}
     const timer=setTimeout(()=>{URL.revokeObjectURL(url);downloads.delete(url);},10000);downloads.set(url,timer);
     status.textContent=`Prepared ${total} records. Save the file privately. Records reflect current access; permissions are checked on every page.`;return;
    }
    if(typeof data.page.nextCursor!=='string'||!data.page.nextCursor||data.page.nextCursor.length>2048||seen.has(data.page.nextCursor))throw Error('The export cursor could not advance. No partial file was downloaded.');
    cursor=data.page.nextCursor;seen.add(cursor);
   }
   throw Error('This scope exceeds the browser’s 10,000-record limit. No partial file was downloaded.');
  }catch(reason){if(current()){error.textContent=reason.message||'Export did not complete. No file was downloaded.';if(reason.code==='reauthentication_required'){const button=document.getElementById('ve-reauth');if(button)button.hidden=false;status.textContent='After confirming your identity, reopen Your data and restart this scope.';}}}
  finally{if(running===task){running=null;task.release();}}
 }

 function init(bridge){if(app)return;app=bridge;sync();window.addEventListener('pagehide',()=>{cancel();revokeDownloads();});document.addEventListener('submit',event=>{if(event.target?.dataset?.veForm!=='export')return;event.preventDefault();prepare(event.target);});document.addEventListener('click',event=>{if(!event.target.closest?.('[data-ve="cancel"]'))return;event.preventDefault();cancel();const status=document.getElementById('ve-status');if(status)status.textContent='Preparation cancelled. No file was downloaded.';});}
 const extension={id:'account-export',init,handles:name=>name==='data',handleAction(name){if(name!=='data')return false;dialog();return true;},onAccount:sync,onLock(){cancel();revokeDownloads();identity='';epoch++;},beforeCloseDialog(){cancel();return true;}};
 window.VoidAccountExport=Object.freeze({extension});
 function register(){window.VoidHome?.registerExtension(extension);}window.addEventListener('voidline:home-ready',register,{once:true});register();
})();

</script>
