import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def versionCodeValue = System.getenv('VOIDLINE_ANDROID_VERSION_CODE') ?: '3'
def versionNameValue = System.getenv('VOIDLINE_ANDROID_VERSION_NAME') ?: '1.0.2'
if (!(versionCodeValue ==~ /[1-9][0-9]{0,8}/)) throw new GradleException('Use a positive Android version code.')
if (!(versionNameValue ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?/)) throw new GradleException('Use a semantic Android version name.')

// The build reads a protected file outside the checkout. Neither the keystore
// nor its password belongs in source, artifacts, logs, or Gradle arguments.
def signingPath = System.getenv('VOIDLINE_ANDROID_SIGNING_FILE') ?: '/workspace/.voidline-private/android/signing.json'
def signingFile = file(signingPath)
def signing = signingFile.exists() ? new JsonSlurper().parse(signingFile) : null

android {
    namespace 'app.voidline.afterhours'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'app.voidline.afterhours'
        minSdk 24
        targetSdk 36
        versionCode versionCodeValue.toInteger()
        versionName versionNameValue
        resValue 'string', 'app_name', 'VOIDLINE'
    }

    signingConfigs {
        release {
            if (signing != null) {
                storeFile file(signing.keystore)
                storePassword file(signing.passwordFile).getText('UTF-8').trim()
                keyAlias signing.alias
                keyPassword file(signing.passwordFile).getText('UTF-8').trim()
                storeType 'PKCS12'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig false }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            maxHeapSize = '1536m'
            testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
}

dependencyLocking { lockAllConfigurations() }

tasks.matching { it.name == 'validateSigningRelease' }.configureEach {
    doFirst {
        if (signing == null) throw new GradleException('Prepare a protected release signing key with build-release.py before building.')
    }
}
